# Rebuilds feed.json (top 3 matchups / trades / waivers / free agents) and league.json (key dates from the Sleeper settings)
# from the tools' public data. Commits only when something changed.
name: Update Home feed
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: ['claude/**']   # the summarising routine pushes a marker commit (message starts with 'hub-tick') to run this job, because GitHub's schedule is unreliable here
concurrency:
  # a push that the job's `if` skips gets its own group, so it can never cancel a real queued run
  group: ${{ (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'hub-tick')) && format('skip-{0}', github.run_id) || 'hub-data' }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  feed:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'hub-tick')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Rumble Central ranks its own best matchups in the page; read the finished weeks we don't have yet (rarely any: once a week)
      - id: check
        run: python3 tools/build_matchups.py --check
      - if: steps.check.outputs.needed == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python3 tools/build_matchups.py
      # IR eligibility: run the FAB tool's own check (it only reads the Sleeper API); if it can't (offseason) the last status is kept
      - uses: actions/checkout@v4
        with:
          repository: namkurd/FAB-Management
          path: fab
      - run: |
          pip install requests
          python3 fab/ir_check.py --json > ir.json || rm -f ir.json
      - run: python3 tools/build_feed.py
      - name: This season's Shotguns (from the Record Book's cache)
        run: python3 tools/build_shotguns.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json league.json managers.json data/matchups.json shotguns.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Update Home feed" && git pull --rebase origin main && git push; fi
