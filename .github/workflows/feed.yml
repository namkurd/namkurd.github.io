# Rebuilds feed.json (top 3 matchups / trades / waivers / free agents) and league.json (key dates from the Sleeper settings)
# from the tools' public data. Commits only when something changed.
name: Update Home feed
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: ['claude/**']   # the summarising routine pushes a marker commit (message starts with 'hub-tick') to run this job, because GitHub's schedule is unreliable here
concurrency:
  # a push that the job's `if` skips gets its own group, so it can never cancel a real queued run
  group: ${{ (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'hub-tick')) && format('skip-{0}', github.run_id) || 'hub-data' }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  feed:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'hub-tick')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Rumble Central ranks its own best matchups in the page; read the finished weeks we don't have yet (rarely any: once a week)
      - id: check
        run: python3 tools/build_matchups.py --check
      - if: steps.check.outputs.needed == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python3 tools/build_matchups.py
      # Top plays: the biggest head-to-head win-probability swings with an embeddable clip, read from the same page (once per finished week)
      - id: playcheck
        run: python3 tools/build_topplays.py --check
      - if: steps.playcheck.outputs.needed == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python3 tools/build_topplays.py
      # Playoff race: each team's odds from Rumble Central's own simulation (read from the page; every few hours while the season is on)
      - id: racecheck
        run: python3 tools/build_race.py --check
      - if: steps.racecheck.outputs.needed == 'true'
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python3 tools/build_race.py
      # fantasy score of each cached play's matchup (no browser needed; also runs when nothing new was scraped)
      - run: python3 tools/build_topplays.py --scores
      # IR eligibility: run the FAB tool's own check (it only reads the Sleeper API); if it can't (offseason) the last status is kept
      - uses: actions/checkout@v4
        with:
          repository: namkurd/FAB-Management
          path: fab
      - run: |
          pip install requests
          python3 fab/ir_check.py --json > ir.json || rm -f ir.json
      - run: python3 tools/build_feed.py
      - name: This season's Shotguns (from the Record Book's cache)
        run: python3 tools/build_shotguns.py
      - run: pip install youtube-transcript-api
        continue-on-error: true
      - name: "Weekly recap (top plays, game of the week, records, standings)"
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}   # the comment of the week (most reactions), chosen once and kept in data/comment_<week>.json
        run: python3 tools/build_recap.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json league.json managers.json data/matchups.json data/topplays*.json shotguns.json shotguns_all.json data/recap*.json data/race.json data/comment_*.json data/trade_pnl.json data/wpcharts.json data/mountrushmore.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Update Home feed" && git pull --rebase --autostash origin main && git push; fi
