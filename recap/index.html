<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Recap</title>
<link rel="stylesheet" href="/shell/tokens.css">
<link rel="preload" href="/recap/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-style: normal; font-display: swap; src: url(/recap/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; font-style: normal; font-display: swap; src: url(/recap/fonts/barlow-condensed-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 800 900; font-style: normal; font-display: swap; src: url(/recap/fonts/barlow-condensed-latin-800-normal.woff2) format("woff2"); }
  /* a late-night sports highlight show: brown-orange studio, red header bars, black name bars, cream score cells, box-score panels */
  :root { --gold: #f2c14e; --cream: #f6e7b9; --ink: #120a04; --red: #d02027; --red2: #8f0f14; --win: #1f8a3c;
    --cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Impact, system-ui, sans-serif; }
  html, body { height: 100%; }
  body { margin: 0; background: #060403; overflow: hidden; font-family: var(--cond); -webkit-tap-highlight-color: transparent; }
  .app { height: 100dvh; display: flex; align-items: center; justify-content: center; }
  .stage { position: relative; width: min(100vw, 470px); height: min(100dvh, 880px); display: flex; flex-direction: column; color: #fff; overflow: hidden; user-select: none; -webkit-user-select: none;
    background: linear-gradient(180deg, #2c1306 0%, #7a3a12 20%, #bb5f26 55%, #cf822e 100%); }
  .stage::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .45; background:
    repeating-linear-gradient(0deg, transparent 0 3px, #0000000d 3px 4px), radial-gradient(120% 50% at 50% 0%, #ffd78a55, transparent 70%); }
  @media (min-width: 520px) { .stage { border: 2px solid var(--red); box-shadow: 0 30px 80px -30px #000, 0 0 0 4px var(--gold); height: min(94dvh, 880px); } }
  .bars { display: flex; gap: 3px; padding: calc(env(safe-area-inset-top) + 4px) 10px 0; flex: none; position: relative; }
  .bars i { flex: 1; height: 16px; position: relative; cursor: pointer; }
  .bars i::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 4px; background: #00000066; }
  .bars i b { position: absolute; left: 0; top: 6px; height: 4px; width: 0; background: var(--gold); }
  .bars i.done b { width: 100%; } .bars i.cur::before { background: #00000099; }
  .top { position: relative; display: flex; align-items: center; gap: 8px; padding: 2px 8px 6px 12px; flex: none; font-size: .9rem; letter-spacing: .08em; text-transform: uppercase; }
  .top a, .top button { color: var(--cream); text-decoration: none; font-weight: 700; flex: none; background: none; border: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 6px 4px; }
  .top .ttl { flex: 1; color: var(--gold); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; border-bottom: 2px solid #f2c14e55; }
  .top .ttl::after { content: " \25BE"; font-size: .8em; }
  .top span { color: var(--cream); font-variant-numeric: tabular-nums; flex: none; min-width: 36px; text-align: right; }
  .top svg { width: 20px; height: 20px; vertical-align: -4px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .seg { position: relative; flex: 1; min-height: 0; padding: 4px 12px 8px; display: flex; flex-direction: column; justify-content: center; gap: 10px; animation: segin .35s ease both; }
  .seg.play { justify-content: flex-start; padding-top: 0; }
  @keyframes segin { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
  @keyframes slide { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
  @keyframes flip { from { transform: rotateX(90deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .in { opacity: 0; animation: slide .4s cubic-bezier(.2,.8,.2,1) forwards; }
  .fl { opacity: 0; animation: flip .35s ease forwards; transform-origin: 50% 50%; }
  @media (prefers-reduced-motion: reduce) { .in, .fl, .seg { animation: none !important; opacity: 1 !important; } .wpb .a { transition: none !important; } }
  /* header: every card opens with a red title bar */
  .hdr { background: linear-gradient(180deg, var(--red), var(--red2)); border-top: 2px solid #ff8a8f55; border-bottom: 3px solid var(--gold); box-shadow: 0 6px 16px -8px #000; }
  .hdr .ht { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 12px 5px; }
  .hdr b { font-size: 1.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; text-shadow: 0 2px 0 #0006; }
  .hdr i { font-style: normal; flex: none; background: var(--ink); color: var(--gold); padding: 2px 9px; font-weight: 800; font-size: .95rem; letter-spacing: .08em; }
  .hdr .hs { background: var(--ink); color: var(--cream); padding: 4px 12px 5px; font-size: 1rem; letter-spacing: .02em; line-height: 1.2; }
  /* the scoreboard: a black bar per row with cream score cells */
  .rows { display: flex; flex-direction: column; gap: 3px; }
  .r { display: grid; grid-auto-flow: column; grid-template-columns: 1fr; grid-auto-columns: minmax(54px, auto); align-items: stretch; background: var(--ink); border-bottom: 2px solid var(--gold); }
  .r .t { padding: 6px 10px; font-size: 1.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .r .t.col { flex-direction: column; align-items: flex-start; gap: 1px; justify-content: center; flex-wrap: nowrap; white-space: normal; }
  .r .t.col > span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r .t.sm { font-size: 1.12rem; padding: 7px 10px; letter-spacing: 0; }
  .r .t.w { white-space: normal; font-size: 1.3rem; line-height: 1.12; }
  .r .t.w.free { text-transform: none; font-size: 1.2rem; font-weight: 700; }
  .r .t small { display: block; white-space: normal; overflow-wrap: anywhere; font-size: .82rem; font-weight: 700; color: var(--gold); letter-spacing: .1em; line-height: 1.1; margin-top: 1px; }
  .chip { font-style: normal; font-size: .8rem; font-weight: 900; letter-spacing: .06em; padding: 1px 6px; line-height: 1.25; } .chip.w { background: var(--win); color: #fff; } .chip.l { background: var(--red); color: #fff; }
  .r .c { min-width: 54px; display: flex; align-items: center; justify-content: center; margin: 3px 2px; padding: 0 8px; background: linear-gradient(180deg, #fff6d6, var(--cream) 55%, #e3cf93); color: var(--ink); font-weight: 800; font-size: 1.45rem; font-variant-numeric: tabular-nums; }
  .r .c.dim { background: linear-gradient(180deg, #d9c9a0, #c9b583); color: #3d2f14; }
  .r .c.g { background: linear-gradient(180deg, #6ed28a, var(--win)); color: #fff; } .r .c.rd { background: linear-gradient(180deg, #ee5a5f, var(--red2)); color: #fff; }
  .r .c.sm { font-size: 1.1rem; min-width: 50px; }
  .r .c.xs { font-size: .95rem; min-width: 0; padding: 0 6px; }
  .r.cols { background: none; border: 0; } .r.cols .t { padding: 0 10px; } .r.cols .c { background: none; margin: 0 2px; padding: 0 8px; min-width: 54px; font-size: .8rem; font-weight: 800; letter-spacing: .1em; color: var(--cream); }
  .r.cut { border-bottom: 4px solid var(--red); margin-bottom: 4px; }
  .r.slim .t { font-size: 1.2rem; padding: 4px 10px; } .r.slim .c { font-size: 1.2rem; }

  /* bars (standings, playoff race): the length is the number */
  .r.bar { grid-template-columns: minmax(104px, 36%) 1fr; }
  .r.bar .trk { position: relative; margin: 6px 4px; background: #ffffff1c; min-width: 40px; }
  .r.bar .trk i, .hb i, .axis i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1) .3s; }
  .r.bar .trk i { background: linear-gradient(90deg, #e3cf93, #f6e7b9); } .r.bar .trk i.g { background: linear-gradient(90deg, #2f9a53, #7be08f); } .r.bar .trk i.rd { background: linear-gradient(90deg, #8f0f14, #ee5a5f); }
  .r.bar .trk i.go, .hb i.go { width: var(--w); }
  .r.bar .trk b { position: relative; display: flex; align-items: center; height: 100%; padding-left: 8px; font-size: 1.2rem; font-weight: 900; color: var(--ink); text-shadow: 0 0 6px #fff8; }
  .r.bar .trk i.g + b, .r.bar .trk i.rd + b { color: #fff; text-shadow: 0 1px 2px #0008; }
  @media (prefers-reduced-motion: reduce) { .r.bar .trk i, .hb i, .axis i { transition: none !important; } }
  /* around the league: scoreboard tiles */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--ink); border-bottom: 3px solid var(--gold); }
  .tile .tw, .tile .tl { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 5px 9px; font-size: 1.2rem; font-weight: 800; text-transform: uppercase; }
  .tile .tw { background: linear-gradient(90deg, transparent, #1f8a3c66); } .tile .tw b { color: #7be08f; font-size: 1.4rem; } .tile .tl { color: #cfc4a4; } .tile .tl b { font-size: 1.2rem; }
  .tile .ft { padding: 2px 9px 6px; font-size: .85rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
  /* career head to head: a tug of war and the last meetings */
  .tug { display: flex; gap: 3px; height: 66px; } .tug > div { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; min-width: 0; font-weight: 900; text-transform: uppercase; }
  .tug .w { background: linear-gradient(180deg, #3fae62, var(--win)); } .tug .l { background: linear-gradient(180deg, #5a4a30, #3b2f1c); color: #e8dcc0; }
  .tug span { font-size: 1.3rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .tug b { font-size: 2.6rem; line-height: 1; }
  .tugs { text-align: center; font-size: 1rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--cream); }
  .dots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .dot { background: var(--ink); border-bottom: 3px solid var(--gold); padding: 5px 4px 6px; text-align: center; min-width: 0; } .dot b { display: block; font-size: 1.05rem; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; } .dot small { display: block; font-size: .75rem; color: var(--cream); line-height: 1.15; }
  .dot.a { border-bottom-color: #3fae62; } .dot.b { border-bottom-color: #8f0f14; }
  /* trade report: lineup PAR as bars either side of zero */
  .tr { background: var(--ink); border-bottom: 2px solid var(--gold); padding: 5px 9px 8px; }
  .tr .th { display: flex; justify-content: space-between; align-items: center; gap: 8px; } .tr .th b { font-size: 1.35rem; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr .vd { flex: none; font-weight: 900; font-size: .85rem; letter-spacing: .06em; padding: 1px 7px; background: #5a4a30; color: #e8dcc0; } .tr .vd.ok { background: var(--win); color: #fff; } .tr .vd.no { background: var(--red); color: #fff; }
  .tr small { display: block; color: var(--gold); font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 3px; }
  .tr .ln { display: grid; grid-template-columns: 88px 1fr; align-items: center; gap: 6px; margin-top: 3px; } .tr .ln > span { font-size: 1rem; font-weight: 800; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; }
  .axis { position: relative; height: 22px; background: #ffffff14; } .axis::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: #fff9; }
  .axis i.p { left: 50%; background: linear-gradient(90deg, #2f9a53, #7be08f); } .axis i.n { right: 0; left: auto; background: linear-gradient(270deg, #8f0f14, #ee5a5f); transform-origin: right; }
  .axis i.p.go, .axis i.n.go { width: var(--w); } .axis i.n { right: 50%; }
  .axis em { position: absolute; top: 50%; transform: translateY(-50%); font-style: normal; font-weight: 900; font-size: 1rem; padding: 0 5px; white-space: nowrap; } .axis em.p { color: #7be08f; } .axis em.n { color: #ff8a8f; }
  /* records: a poster per record */
  .hero { text-align: center; padding: 8px 10px 10px; background: linear-gradient(180deg, #0006, #0002); border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); }
  .hero .hk { display: inline-block; background: var(--red); padding: 2px 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; font-size: .95rem; }
  .hero .hv { font-size: 4.2rem; font-weight: 900; line-height: 1; color: var(--gold); text-shadow: 0 3px 0 #0008; margin-top: 4px; } .hero .hn { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; } .hero .hw { color: var(--cream); font-size: 1rem; }
  /* all-time movers: tiles */
  .mvs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mc { background: var(--ink); border-bottom: 3px solid var(--gold); padding: 6px 10px 8px; } .mc b { display: block; font-size: 2.6rem; line-height: 1; } .mc.up b { color: #7be08f; } .mc.dn b { color: #ff8a8f; } .mc.dn { border-bottom-color: var(--red); }
  .mc span { display: block; font-size: 1.35rem; font-weight: 800; text-transform: uppercase; } .mc small { display: block; color: var(--gold); font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  /* league chat: the comment of the week, then the busiest threads */
  .cotw { background: linear-gradient(180deg, #0007, #0003); border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); padding: 8px 12px 10px; }
  .cotw .hk { display: inline-block; background: var(--red); padding: 2px 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; font-size: .9rem; }
  .cotw p { margin: 6px 0 4px; font-size: 1.5rem; line-height: 1.2; font-weight: 700; } .cotw .cm { font-size: 1rem; color: var(--cream); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; } .cotw .cm b { color: var(--gold); text-transform: uppercase; } .cotw .rx { margin-left: auto; font-weight: 700; }
  .topic { background: var(--ink); border-bottom: 2px solid var(--gold); padding: 6px 10px 7px; } .topic b { display: block; font-size: 1.2rem; line-height: 1.15; margin: 4px 0 5px; font-weight: 700; }
  .topic .chip { text-transform: uppercase; } .topic .tm { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--cream); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .hb { flex: 1; position: relative; height: 8px; background: #ffffff22; } .hb i { background: linear-gradient(90deg, #d9c9a0, var(--gold)); }
  .hero .hv small { font-size: 1.6rem; margin-left: 8px; color: var(--cream); font-weight: 800; text-transform: uppercase; }
  .axis em.ins { color: #fff !important; text-shadow: 0 1px 3px #000b; }

  /* trade report: players and the chat's value on each side */
  .sd { margin-top: 4px; } .sn { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; } .sn b { font-size: 1.1rem; text-transform: uppercase; color: var(--gold); }
  .sn .pl { font-size: .95rem; color: #fff; flex: 1; min-width: 0; } .sn .pl u { text-decoration: none; font-size: .7rem; color: var(--cream); background: #ffffff22; padding: 0 4px; }
  .sn .sv { flex: none; margin-left: auto; font-size: .85rem; font-weight: 900; letter-spacing: .05em; padding: 0 6px; background: #5a4a30; color: #e8dcc0; } .sn .sv.pos { background: var(--win); color: #fff; } .sn .sv.neg { background: var(--red); color: #fff; }
  .tr .axis { margin-top: 2px; }
  /* clinch watch */
  .sc { background: var(--ink); border-bottom: 3px solid var(--gold); padding: 6px 10px 8px; }
  .sc .sh { display: flex; align-items: center; gap: 12px; } .sc .sh .c { font-size: 2.6rem; font-weight: 900; min-width: 78px; text-align: center; padding: 0 6px; line-height: 1.15; background: linear-gradient(180deg, #6ed28a, var(--win)); color: #fff; } .sc .sh .c.rd { background: linear-gradient(180deg, #ee5a5f, var(--red2)); }
  .sc .sh b { display: block; font-size: 1.6rem; text-transform: uppercase; line-height: 1.05; } .sc .sh small { color: var(--gold); font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .sc .sw { margin-top: 6px; font-size: .95rem; color: var(--cream); } .chs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; } .chs span { background: #ffffff1c; padding: 1px 8px; font-size: 1.05rem; font-weight: 700; text-transform: uppercase; } .chs b { color: var(--gold); }
  /* coming up: a countdown per date */
  .cd { background: linear-gradient(180deg, #0007, #0003); border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); padding: 8px 12px 10px; text-align: center; }
  .cd .hk { display: inline-block; background: var(--red); padding: 2px 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; font-size: .95rem; }
  .cd .cn { font-size: 3.4rem; font-weight: 900; line-height: 1; color: var(--gold); text-shadow: 0 3px 0 #0008; margin-top: 4px; } .cd.hot .cn { color: #ff8a8f; } .cd .cw { font-size: 1.2rem; font-weight: 700; text-transform: uppercase; color: #fff; } .cd .cw small { display: block; font-size: .85rem; color: var(--cream); letter-spacing: .04em; }
  /* all-time movers: the number behind the move */
  .mc em { display: block; font-style: normal; font-size: 1.25rem; font-weight: 800; color: #fff; margin-top: 2px; } .mc s { display: block; text-decoration: none; font-size: .85rem; color: var(--cream); }
  /* rundown on the opener */
  .rd { display: flex; flex-direction: column; gap: 8px; }
  .rd p { margin: 0; display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: center; background: #00000055; border-bottom: 2px solid var(--gold); padding: 8px 10px 8px 0; font-size: 1.35rem; font-weight: 700; line-height: 1.15; }
  .rd p em { font-style: normal; text-align: center; background: var(--red); color: #fff; font-size: .9rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; padding: 3px 0; margin-left: 0; }
  /* box score panels */
  .box { display: grid; grid-template-columns: 1fr 1fr; background: #00000050; border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); }
  .box > div { padding: 0 0 6px; border-right: 2px solid var(--gold); min-width: 0; } .box > div:last-child { border-right: 0; }
  .box h4 { margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; background: var(--ink); padding: 4px 8px; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .04em; }
  .box h4 s { text-decoration: none; background: var(--red); padding: 1px 7px; font-size: .9rem; }
  .box p { margin: 0; padding: 4px 8px 6px; font-size: .95rem; line-height: 1.2; color: #fff; }
  .box p b { display: block; color: var(--gold); font-size: 1.08rem; text-transform: uppercase; letter-spacing: .02em; }
  .box p u { text-decoration: none; color: #9bf5b0; font-weight: 800; }
  .notes { background: #00000050; border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); padding: 0 0 6px; }
  .notes h4 { margin: 0 0 4px; background: var(--ink); color: var(--gold); padding: 4px 9px; font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; border-left: 4px solid var(--red); }
  .notes p { margin: 0; padding: 3px 10px; font-size: 1.1rem; line-height: 1.25; }
  .notes p.q { font-size: 1.4rem; line-height: 1.25; font-weight: 600; padding: 6px 10px; }
  .notes a { color: var(--gold); }
  .notes p.meet { display: flex; justify-content: space-between; gap: 10px; padding: 3px 10px; } .notes p.meet b { text-transform: uppercase; font-size: 1.15rem; } .notes p.meet span { color: var(--cream); }
  /* clips: edge to edge, then the broadcast lower-third underneath */
  .vid { position: relative; margin: 0 -12px; width: calc(100% + 24px); aspect-ratio: 16 / 9; background: #000; border-bottom: 3px solid var(--gold); box-shadow: 0 8px 22px #0009; }
  .vid iframe, .vid > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .vid .tap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; background: #000000b0; color: #fff; font: inherit; font-weight: 900; font-size: 1.4rem; letter-spacing: .1em; text-transform: uppercase; border: 0; width: 100%; cursor: pointer; z-index: 2; }
  .vid .tap svg { width: 42px; height: 42px; fill: #fff; }
  .vid .snd { position: absolute; left: 8px; bottom: 8px; z-index: 2; background: var(--red); color: #fff; border: 0; padding: 4px 10px; font: inherit; font-weight: 800; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
  .sit { background: var(--ink); border-bottom: 2px solid var(--gold); padding: 5px 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 1.05rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--cream); }
  .sit b { color: var(--gold); font-weight: 800; } .sit s { text-decoration: none; background: var(--red); color: #fff; padding: 0 6px; font-weight: 800; }

    return '<div class="hdr in"><div class="ht"><b>' + esc(title) + '</b>' + (chip ? '<i>' + esc(chip) + '</i>' : '') + '</div>' + (sub ? '<div class="hs">' + esc(sub) + '</div>' : '') + '</div>';
  }
  // rows: [{t, tag:'W'|'L', sub, w:1 (wrap), free:1, sm:1, slim:1, c:[{v, k}]}]; cols: labels for the cell columns, shown above them
  function board(rows, cols) {
    return '<div class="rows">' + (cols ? '<div class="r cols"><span class="t"></span>' + cols.map(function (c) { return '<span class="c">' + esc(c) + '</span>'; }).join('') + '</div>' : '') + rows.map(function (r, i) {
      var chip = r.tag ? '<em class="chip ' + (/^(W|IN|BYE)$/.test(r.tag) ? 'w' : 'l') + '">' + r.tag + '</em>' : '';
      return '<div class="r in' + (r.slim ? ' slim' : '') + (r.cut ? ' cut' : '') + '"' + ds(i) + '><span class="t' + (r.sub ? ' col' : '') + (r.w ? ' w' : '') + (r.free ? ' free' : '') + (r.sm ? ' sm' : '') + '"><span>' + esc(r.t) + (chip ? ' ' + chip : '') + '</span>' + (r.sub ? '<small>' + esc(r.sub) + '</small>' : '') + '</span>' +
        (r.c || []).map(function (c, j) { return '<span class="c fl ' + (c.k || '') + '"' + ds(i + j + 3) + '>' + esc(c.v) + '</span>'; }).join('') + '</div>';
    }).join('') + '</div>';
  }
  function f1(n) { return Number(n).toFixed(1); }
  function sgn(n) { return (n >= 0 ? '+' : '\u2212') + Math.abs(n).toFixed(1); }
  function ppct(x) { if (x == null) return '\u2013'; var v = x * 100; return v >= 99.5 && v < 100 ? '>99%' : v > 0 && v < .5 ? '<1%' : Math.round(v) + '%'; }
  function pts(n) { return (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(1); }
  function situation(si, et) {   // the NFL game the play happened in: matchup, quarter and clock, the NFL score going in, kickoff
    if (!si) return '';
    var q = si.q > 4 ? 'OT' : 'Q' + si.q;
    return '<div class="sit in"' + ds(2) + '><span><b>' + esc(si.team) + '</b> ' + (si.at ? '@' : 'vs') + ' <b>' + esc(si.opp) + '</b></span><s>' + q + ' ' + esc(si.clock) + '</s><span>' + si.tm + '–' + si.op + '</span>' + (et ? '<span>' + esc(et.replace(/ ([AP])M$/, function (m, x) { return x.toLowerCase(); })) + '</span>' : '') + '</div>';
  }
  function render(s) {
    if (s.type === 'intro') return hdr('Week ' + s.week + ' recap', '', '') + '<div class="rd">' + (s.rundown || []).map(function (x, i) { return '<p class="in"' + ds(i + 1) + '><em>' + esc(x.k) + '</em><span>' + esc(x.t) + '</span></p>'; }).join('') + '</div>';
    if (s.type === 'play') {
      var fa = s.fant, f = s.from == null ? 0 : s.from, t = s.to == null ? 0 : s.to;
      return '<div class="vid"></div>' + hdr(s.label, s.head || '', s.rank ? '#' + s.rank : '') +
        board([{ t: s.title, w: 1, c: [{ v: (s.pts == null ? '' : pts(s.pts)), k: 'g' }] }]) + situation(s.sit, s.et) +
        (fa ? board([{ t: fa.m, tag: fa.ms > fa.os ? 'W' : 'L', slim: 1, c: [{ v: f1(fa.ms), k: fa.ms > fa.os ? 'g' : 'dim' }] }, { t: fa.o, tag: fa.ms > fa.os ? 'L' : 'W', slim: 1, c: [{ v: f1(fa.os), k: 'dim' }] }]) : '') +
        (s.from == null ? '' : '<div class="wpd in"' + ds(4) + ' data-f="' + f + '" data-t="' + t + '"><div class="wh"><span class="who">' + esc(s.by || 'Win') + '\u2019s win chance</span><span class="swg" style="opacity:0">' + (t >= f ? '+' : '\u2212') + Math.abs(t - f) + '</span></div><div class="wn"><b class="cur">' + f + '%</b></div><div class="trk"><i class="gain"></i><i class="tick"></i><i class="head"></i><i class="m"></i></div></div>') +
        '<div class="links"><a href="' + esc(s.replay) + '">Replay in Rumble Central</a></div>';
    }
    if (s.type === 'game') return hdr('Game of the week', s.head || s.why, '') +
      board([{ t: s.w, tag: 'W', c: [{ v: f1(s.ws), k: 'g' }] }, { t: s.l, tag: 'L', c: [{ v: f1(s.ls), k: 'dim' }] }]) +
      '<div class="box">' + (s.sides || []).map(function (x, i) { return '<div class="in"' + ds(i + 3) + '><h4>' + esc(x.m) + (x.rec ? '<s>' + esc(x.rec) + '</s>' : '') + '</h4>' +
        (x.lines || []).map(function (l) { return '<p><b>' + esc(l.t) + '</b><u>' + (l.pts == null ? '' : pts(l.pts) + ' pts') + '</u></p>'; }).join('') + '</div>'; }).join('') + '</div>';
    if (s.type === 'finals') return hdr('Around the league', '', '') + '<div class="tiles">' + (s.games || []).map(function (g, i) {
      return '<div class="tile in"' + ds(i) + '><div class="tw"><span>' + esc(g.w) + '</span><b>' + f1(g.ws) + '</b></div><div class="tl"><span>' + esc(g.l) + '</span><b>' + f1(g.ls) + '</b></div>' + (g.sr ? '<div class="ft">Career ' + esc(g.sr) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
    if (s.type === 'trades') {
      var mx = 1; (s.rows || []).forEach(function (r) { mx = Math.max(mx, Math.abs(r.lga), Math.abs(r.lgb)); });
      var line = function (name, got, v, sv) { var w = Math.round(Math.abs(v) / mx * 50), inside = w >= 26, cls = sv == null ? '' : sv > 0.15 ? ' pos' : sv < -0.15 ? ' neg' : '';
        return '<div class="sd"><div class="sn"><b>' + esc(name) + '</b><span class="pl">got ' + ((got || []).map(function (g) { return esc(g.n) + (g.p ? ' <u>' + g.p + '</u>' : ''); }).join(', ') || '–') + '</span>' + (sv == null ? '' : '<span class="sv' + cls + '">CHAT ' + (sv > 0 ? '+' : sv < 0 ? '−' : '') + Math.abs(sv).toFixed(1) + '</span>') + '</div>' +
          '<div class="axis"><i class="' + (v >= 0 ? 'p' : 'n') + '" style="--w:' + w + '%"></i><em class="' + (v >= 0 ? 'p' : 'n') + (inside ? ' ins' : '') + '" style="' + (v >= 0 ? (inside ? 'left:' + (50 + w) + '%;transform:translate(-100%,-50%)' : 'left:' + (50 + w) + '%') : (inside ? 'right:' + (50 + w) + '%;transform:translate(100%,-50%)' : 'right:' + (50 + w) + '%')) + '">' + sgn(v) + ' PAR</em></div></div>'; };
      return hdr('Trade report', s.head || '', '') + (s.rows || []).slice(0, window.innerHeight < 700 ? 3 : 4).map(function (r, i) {
        var vd = r.verdict === 'right' ? '<span class="vd ok">CHAT ✓</span>' : r.verdict === 'wrong' ? '<span class="vd no">CHAT ✗</span>' : '<span class="vd">NO CHAT CALL</span>';
        var mv = r.moved == null ? '' : (function () { var d = r.par > 0 ? r.moved : -r.moved; return ' · lead ' + (d >= 0 ? 'grew ' : 'shrank ') + Math.abs(d).toFixed(1) + ' this week'; })();
        return '<div class="tr in"' + ds(i + 1) + '><div class="th"><b>' + esc(r.a) + ' ⇄ ' + esc(r.b) + '</b>' + vd + '</div><small>wk ' + r.w + ' · ' + r.weeks + ' wks of lineups' + esc(mv) + '</small>' + line(r.a, r.ga, r.lga, r.sa) + line(r.b, r.gb, r.lgb, r.sb) + '</div>';
      }).join('') +
        '<div class="notes in"' + ds(7) + '><h4>Season trade PAR</h4><p>' + (s.best || []).map(function (x) { return '<b>' + esc(x.m) + '</b> ' + sgn(x.v); }).concat((s.worst || []).map(function (x) { return '<b style="color:#ff8a8f">' + esc(x.m) + '</b> ' + sgn(x.v); })).join(' · ') + '</p>' + (s.clear ? '<p>Chat called <b>' + s.right + ' of ' + s.clear + '</b> clear ones right</p>' : '') + '</div>';
    }
    if (s.type === 'race') return hdr('Playoff race', s.head || '', s.weeksLeft + (s.weeksLeft === 1 ? ' WK LEFT' : ' WKS LEFT')) +
      '<div class="rows">' + (s.teams || []).map(function (t, i) {
        var chip = t.dead ? 'OUT' : t.top ? '1 SEED' : t.z ? 'BYE' : t.x ? 'IN' : '', k = t.make >= .95 ? 'g' : t.make < .2 ? 'rd' : '';
        return '<div class="r bar in' + (t.rank === s.spots ? ' cut' : '') + '"' + ds(i) + '><span class="t sm">' + t.rank + '  ' + esc(t.m) + (chip ? ' <em class="chip ' + (t.dead ? 'l' : 'w') + '">' + chip + '</em>' : '') + '</span><span class="trk"><i class="' + k + '" style="--w:' + Math.round(t.make * 100) + '%"></i><b>' + ppct(t.make) + '</b></span>' + (s.byes > 1 ? '<span class="c dim sm">' + ppct(t.bye) + '</span>' : '') + '</div>';
      }).join('') + '</div>';
    if (s.type === 'pod') return hdr('The podcast', s.name || '', s.ep ? 'EP ' + s.ep : '') +
      '<div class="notes in"' + ds(2) + '><h4>Overheard at ' + fmt(s.at) + '</h4><p class="q">“' + esc(s.quote) + '”</p><p class="meet"><a href="' + esc(s.url) + '" target="_blank" rel="noopener">Listen at that moment</a></p></div>';
    if (s.type === 'slack') {
      var c = s.comment, em = { fire: '🔥', '+1': '👍', joy: '😂', book: '📖', eyes: '👀', heart: '❤️', '100': '💯', raised_hands: '🙌', clap: '👏', skull: '💀', sob: '😭', muscle: '💪', tada: '🎉', 'thumbsup': '👍', laughing: '😆', point_up: '☝️' };
      var mxn = 1; (s.items || []).forEach(function (x) { mxn = Math.max(mxn, x.n); });
      var clean = function (t) { t = String(t || '').replace(/[*_~`]/g, '').trim(); return t.charAt(0).toUpperCase() + t.slice(1); };
      return hdr('League chat', '', '') +
        (c ? '<div class="cotw in"' + ds(1) + '><span class="hk">Comment of the week</span><p>“' + esc(clean(c.text)) + '”</p><div class="cm"><b>' + esc(c.who) + '</b> in #' + esc(c.channel) + '<span class="rx">' + (c.reactions || []).map(function (r) { return em[r.name] ? em[r.name] + (r.count > 1 ? '×' + r.count : '') : ''; }).join(' ') + ' · ' + c.n + ' reactions</span></div></div>' : '') +
        (s.items || []).map(function (x, i) { return '<div class="topic in"' + ds(i + 3) + '><em class="chip l">#' + esc(x.ch) + '</em><b>' + esc(clean(x.t)) + '</b><div class="tm"><span class="hb"><i style="--w:' + Math.round(x.n / mxn * 100) + '%"></i></span><span>' + x.n + ' msgs · ' + x.p + ' people</span></div></div>'; }).join('');
    }
    if (s.type === 'shotguns') return hdr('Shotgun watch', '', '') +
      board(s.items.map(function (x) { return { t: x.m, sub: x.player + (x.pos ? ' (' + x.pos + ')' : ''), c: [{ v: '0.0', k: 'rd' }] }; }));
    if (s.type === 'records') return hdr('Record book', '', '') +
      (s.items || []).slice(0, 2).map(function (x, i) { return '<div class="hero in"' + ds(i + 1) + '><span class="hk">' + esc(x.name) + '</span><div class="hv">' + (function (v) { var m = /^(\S+)\s+(.+)$/.exec(String(v)); return m ? esc(m[1]) + '<small>' + esc(m[2]) + '</small>' : esc(v); })(x.new) + '</div><div class="hn">' + esc(x.holder) + '</div>' + (x.old ? '<div class="hw">was ' + esc(x.old) + (x.prev && x.prev !== x.holder ? ' · ' + esc(x.prev) : '') + '</div>' : '') + '</div>'; }).join('') +
      ((s.items || []).length > 2 ? '<div class="notes in"' + ds(4) + '>' + s.items.slice(2).map(function (x) { return '<p><b>' + esc(x.name) + '</b> ' + esc(x.new) + ' · ' + esc(x.holder) + '</p>'; }).join('') + '</div>' : '');
    if (s.type === 'lifetime') return hdr('All-time standings', s.head || '', '') + '<div class="mvs">' + (s.items || []).map(function (x, i) {
      var up = x.delta > 0; return '<div class="mc in ' + (up ? 'up' : 'dn') + '"' + ds(i + 1) + '><b>' + (up ? '▲' : '▼') + Math.abs(x.delta) + '</b><span>' + esc(x.m) + '</span><small>' + esc(x.metric) + ' · #' + x.rank + '</small>' +
        '<em>' + esc(x.val || '') + '</em>' + (x.vs ? '<s>' + (x.vs.passed ? 'passed ' : 'passed by ') + esc(x.vs.m) + ' (' + esc(x.vs.val) + ')</s>' : '') + '</div>'; }).join('') + '</div>';
    if (s.type === 'standings') { var top = 1; (s.rows || []).forEach(function (r) { top = Math.max(top, r.rumbles); });
      return hdr('Standings', s.head || '', 'WK ' + D.week) + '<div class="rows">' + s.rows.map(function (r, i) {
        var dl = r.prev - r.rank;
        return '<div class="r bar in"' + ds(i) + '><span class="t sm">' + r.rank + '  ' + esc(r.m) + '</span><span class="trk"><i class="' + (dl >= 2 ? 'g' : '') + '" style="--w:' + Math.round(r.rumbles / top * 100) + '%"></i><b>' + r.rumbles + '</b></span><span class="c dim sm">+' + r.gain + '</span><span class="c sm ' + (dl > 0 ? 'g' : dl < 0 ? 'rd' : 'dim') + '">' + (dl ? (dl > 0 ? '▲' : '▼') + Math.abs(dl) : '–') + '</span></div>';
      }).join('') + '</div>'; }
    if (s.type === 'clinch') return hdr('Clinch watch', '', s.weeksLeft + (s.weeksLeft === 1 ? ' WK LEFT' : ' WKS LEFT')) + (s.items || []).map(function (x, i) {
      var what = x.kind === 'clinch' ? 'to clinch a playoff spot' : x.kind === 'bye' ? 'to clinch a first-round bye' : 'to stay alive', k = x.kind === 'alive' ? 'rd' : 'g';
      var cond = x.kind === 'alive' ? (x.must ? 'At least ' + x.must + ' of these must stay under their number' : '') : (x.allow >= 0 ? (x.allow === 0 ? 'None of these can reach their number' : 'No more than ' + x.allow + ' of these can reach their number') : '');
      return '<div class="sc in"' + ds(i + 1) + '><div class="sh"><span class="c ' + k + '">' + (x.own != null ? x.own : x.need) + '+</span><div><b>' + esc(x.m) + '</b><small>Rumbles ' + what + (x.own != null ? ' on their own' : '') + '</small></div></div>' +
        (x.own == null && cond ? '<div class="sw">' + esc(cond) + '</div><div class="chs">' + (x.help || []).map(function (h) { return '<span>' + esc(h.n) + ' <b>' + h.th + '+</b></span>'; }).join('') + '</div>' : '') + '</div>';
    }).join('');
    if (s.type === 'coming') return hdr('Coming up', '', '') + (s.items || []).map(function (x, i) {
      var big = x.days === 0 ? 'TODAY' : x.days === 1 ? 'TOMORROW' : x.days + ' DAYS';
      return '<div class="cd in' + (x.days <= 3 ? ' hot' : '') + '"' + ds(i + 1) + '><span class="hk">' + esc(x.label) + '</span><div class="cn">' + big + '</div><div class="cw">' + esc(x.when) + (x.sub ? '<small>' + esc(x.sub) + '</small>' : '') + '</div></div>';
    }).join('');
    return '';
  }
  // ---- controls: buttons, tap the sides of a card, hold to pause, the chapter sheet, share, sound
  function toggle() { userPaused = !userPaused; applyPause(); }
  function begin(at) { $('cover').hidden = true; started = true; ended = false; last = performance.now(); go(at); requestAnimationFrame(tick); }
  $('go').onclick = function () { begin(0); if (startAt != null && startAt > 0) { if (full) go(startAt); else waiting = startAt; } };
  $('pp').onclick = toggle;
  $('next').onclick = function () { if (ended || !started) return; go(idx + 1); };
  $('prev').onclick = function () { if (!started) return; if (ended) { ended = false; last = performance.now(); go(segs.length - 1); requestAnimationFrame(tick); return; } go(elapsed > 2 ? idx : idx - 1); };
  $('mu').onclick = function () { muted = !muted; try { if (yt) { muted ? yt.mute() : yt.unMute(); } } catch (e) { /* not ready */ } this.style.opacity = muted ? .55 : 1; this.setAttribute('aria-pressed', muted); };
  $('bars').addEventListener('click', function (e) { var i = e.target.closest('i'); if (!i || !started) return; ended = false; go(Number(i.dataset.i)); });
  var holdT = null, downX = 0, downAt = 0, heldNow = false;
  $('seg').addEventListener('pointerdown', function (e) {
    if (e.target.closest('a, button, .vid')) return;
    downX = e.clientX; downAt = Date.now(); heldNow = false;
    holdT = setTimeout(function () { heldNow = true; held = true; applyPause(); }, 320);
  });
  function release(e) {
    clearTimeout(holdT);
    if (heldNow) { held = false; heldNow = false; applyPause(); return; }
    if (!e || !started || ended || e.type === 'pointercancel' || Date.now() - downAt > 320 || e.target.closest('a, button, .vid')) return;
    var r = $('seg').getBoundingClientRect(), x = (downX - r.left) / r.width;
    if (x < .3) $('prev').click(); else if (x > .7) $('next').click();
  }
  $('seg').addEventListener('pointerup', release); $('seg').addEventListener('pointercancel', release);
  $('ttl').onclick = function () {
    var sh = $('sheet'); if (!sh.hidden) { sh.hidden = true; return; }
    var list = full ? segs : raw.filter(function (x) { return x.type !== 'clips'; });
    sh.innerHTML = list.map(function (s, i) { return '<button type="button" data-i="' + i + '" class="' + (i === idx ? 'on' : '') + '"><small>' + (i + 1) + '</small>' + esc(s.type === 'play' ? (s.turn ? 'Turning point' : '#' + s.rank + ' ' + s.title) : (NAMES[s.type] || s.title || '')) + '</button>'; }).join('');
    sh.hidden = false;
  };
  $('sheet').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; $('sheet').hidden = true; ended = false; if (!started) begin(Number(b.dataset.i)); else go(Number(b.dataset.i)); });
  document.addEventListener('click', function (e) { if (!e.target.closest('#sheet, #ttl')) $('sheet').hidden = true; });
  function toast(t) { var el = $('toast'); el.textContent = t; el.hidden = false; setTimeout(function () { el.hidden = true; }, 1800); }
  $('share').onclick = function () {
    var url = location.origin + location.pathname + '?week=' + D.week + (idx > 0 ? '#' + idx : ''), title = 'Week ' + D.week + ' recap';
    if (navigator.share) navigator.share({ title: title, url: url }).catch(function () { /* cancelled */ });
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }, function () { toast(url); });
    else toast(url);
  };
  document.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') $('next').click(); else if (e.key === 'ArrowLeft') $('prev').click(); else if (e.key === ' ' && started) { e.preventDefault(); toggle(); } else if (e.key === 'Escape') $('sheet').hidden = true; });
  load();
})();
