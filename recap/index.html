<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Recap</title>
<link rel="stylesheet" href="/shell/tokens.css">
<style>
  /* a late-night sports highlight show: brown-orange studio, red header bars, black name bars, cream score cells, box-score panels */
  :root { --gold: #f2c14e; --cream: #f6e7b9; --ink: #120a04; --red: #d02027; --red2: #8f0f14; --win: #1f8a3c;

    background: linear-gradient(180deg, #2c1306 0%, #7a3a12 20%, #bb5f26 55%, #cf822e 100%); }

  .bars i { flex: 1; height: 4px; background: #00000066; overflow: hidden; }

  .top { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 12px 6px; flex: none; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; }
  .top a { color: var(--cream); text-decoration: none; font-weight: 700; flex: none; }
  .top b { flex: 1; text-align: center; color: var(--gold); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top span { color: var(--cream); font-variant-numeric: tabular-nums; flex: none; min-width: 38px; text-align: right; }

  .hdr b { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: .03em; line-height: 1.05; text-shadow: 0 2px 0 #0006; }
  .hdr i { font-style: normal; flex: none; background: var(--ink); color: var(--gold); padding: 2px 9px; font-weight: 800; font-size: .9rem; letter-spacing: .08em; }
  .hdr .hs { background: var(--ink); color: var(--cream); padding: 4px 12px 5px; font-size: .88rem; letter-spacing: .03em; line-height: 1.25; }
  /* the scoreboard: a black bar per row with cream score cells */
  .rows { display: flex; flex-direction: column; gap: 3px; }
  .r { display: grid; grid-auto-flow: column; grid-template-columns: 1fr; grid-auto-columns: minmax(54px, auto); align-items: stretch; background: var(--ink); border-bottom: 2px solid var(--gold); }
  .r .t { padding: 6px 10px; font-size: 1.4rem; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

  .r .t.col > span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .r .t small { display: block; white-space: normal; overflow-wrap: anywhere; font-size: .78rem; font-weight: 700; color: var(--gold); letter-spacing: .1em; line-height: 1.1; }
  .chip { font-style: normal; font-size: .78rem; font-weight: 900; letter-spacing: .06em; padding: 1px 6px; line-height: 1.25; } .chip.w { background: var(--win); color: #fff; } .chip.l { background: var(--red); color: #fff; }

  .r .c.dim { background: linear-gradient(180deg, #d9c9a0, #c9b583); color: #3d2f14; }
  .r .c.g { background: linear-gradient(180deg, #6ed28a, var(--win)); color: #fff; } .r .c.rd { background: linear-gradient(180deg, #ee5a5f, var(--red2)); color: #fff; }

  .box h4 s { text-decoration: none; background: var(--red); padding: 1px 7px; font-size: .85rem; }
  .box p { margin: 0; padding: 4px 8px 6px; font-size: .86rem; line-height: 1.2; color: #fff; }
  .box p b { display: block; color: var(--gold); font-size: .98rem; text-transform: uppercase; letter-spacing: .02em; }
  .box p u { text-decoration: none; color: #9bf5b0; font-weight: 800; }
  .notes { background: #00000050; border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); padding: 0 0 6px; }
  .notes h4 { margin: 0 0 4px; background: var(--ink); color: var(--gold); padding: 4px 9px; font-size: .95rem; text-transform: uppercase; letter-spacing: .08em; border-left: 4px solid var(--red); }
  .notes p { margin: 0; padding: 3px 10px; font-size: 1rem; line-height: 1.3; } .notes p b { color: var(--gold); text-transform: uppercase; }
  .notes p.q { font-size: 1.25rem; line-height: 1.3; font-weight: 600; padding: 6px 10px; } .notes small { display: block; padding: 2px 10px; color: var(--cream); font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; }
  .notes a { color: var(--gold); }
  /* clips and the podcast thumbnail */
  .vid { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 3px solid var(--gold); box-shadow: 0 8px 22px #0009, 0 0 0 2px var(--red2); box-sizing: border-box; }
  .vid iframe, .vid > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  a.thumb { display: block; position: relative; aspect-ratio: 16 / 9; background: #000 center / cover; border: 3px solid var(--gold); box-shadow: 0 8px 22px #0009, 0 0 0 2px var(--red2); box-sizing: border-box; }
  a.thumb::after { content: "\25B6"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #fff; text-shadow: 0 2px 12px #000; background: #0000002e; }
  .links { font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; } .links a { color: var(--cream); margin-right: 14px; }
  .wp { display: flex; align-items: stretch; gap: 6px; } .wp .t { font-size: .95rem; white-space: normal; line-height: 1.1; }
  /* controls */
  .ctl { position: relative; flex: none; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 12px calc(env(safe-area-inset-bottom) + 12px); border-top: 3px solid var(--red); background: #00000040; }
  .ctl button { width: 52px; height: 44px; border: 2px solid var(--gold); background: var(--ink); color: var(--cream); font-size: 1rem; cursor: pointer; }
  .ctl button.p { width: 72px; } .ctl button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .cover { position: absolute; inset: 0; z-index: 5; background: linear-gradient(180deg, #1f0d05f2, #6a300eee 60%, #b9591fee); display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 24px 14px; }
  .cover[hidden] { display: none; }
  .cover button { margin-top: 6px; align-self: center; padding: 14px 38px; border: 3px solid var(--gold); background: var(--red); color: #fff; font-family: var(--cond); font-weight: 900; font-size: 1.2rem; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  .cover button:disabled { opacity: .55; cursor: default; background: var(--ink); color: var(--gold); }
  .cover .st { text-align: center; font-size: .9rem; letter-spacing: .1em; text-transform: uppercase; color: var(--cream); } .cover a { text-align: center; color: var(--cream); font-size: .85rem; }
</style></head><body class="dtf-page">
<div class="app"><div class="stage" id="stage">
  <div class="bars" id="bars"></div>
  <div class="top"><a href="/">&larr; Hub</a><b id="ttl">Weekly recap</b><span id="clock"></span></div>
  <div class="seg" id="seg"></div>
  <div class="ctl"><button id="prev" aria-label="Previous">&#9664;</button><button id="pp" class="p" aria-label="Pause">&#10074;&#10074;</button><button id="next" aria-label="Next">&#9654;</button></div>
  <div class="cover" id="cover">
    <div class="hdr"><div class="ht"><b>Rumble Hub</b><i id="cw">&nbsp;</i></div><div class="hs" id="ch">Weekly recap</div></div>
    <div class="rows"><div class="r"><span class="t">Run time</span><span class="c dim" id="cs">&nbsp;</span></div></div>
    <div class="st" id="cst">Loading&hellip;</div>
    <button id="go" disabled>&#9654; Watch</button><a href="/">Back to the Hub</a>
  </div>
</div></div>
<script>
(function () {

  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var D = null, raw = [], segs = [], idx = -1, paused = false, elapsed = 0, last = 0, yt = null, ytApi = null, started = false, ended = false, cur = null, ready = false;

  }
  // ---- only clips that play inline: every candidate (its clip, else its alternate) is tried once in a hidden player; an owner who blocks embedding answers with an error

      return new Promise(function (resolve) {
        var holder = document.createElement('div'), slot = document.createElement('div'), pl = null, done = false, timer;
        holder.style.cssText = 'position:fixed;left:-400px;top:0;width:160px;height:90px;overflow:hidden;pointer-events:none;opacity:0'; holder.appendChild(slot); document.body.appendChild(holder);
        function end(ok) {

          events: { onReady: function () { setTimeout(function () { end(true); }, 1200); }, onError: function () { end(false); } } });

  function total() { return segs.reduce(function (a, x) { return a + x.dur; }, 0); }

    idx = i; cur = segs[i]; elapsed = 0;
    [].forEach.call($('bars').children, function (b, k) { b.className = k < i ? 'done' : ''; b.firstChild.style.width = ''; });
    $('ttl').textContent = NAMES[cur.type] || ('Week ' + D.week + ' recap'); $('seg').innerHTML = render(cur); fit(); $('seg').style.animation = 'none'; void $('seg').offsetWidth; $('seg').style.animation = '';

    }).join('') + '</div>';

  function f1(n) { return Number(n).toFixed(1); }

  var NAMES = { intro: 'Final scores', play: 'Top plays', game: 'Game of the week', pod: 'The podcast', slack: 'League chat', shotguns: 'Shotgun watch', records: 'Record book', lifetime: 'All-time', standings: 'Standings', outro: 'Next up' };
  function render(s) {
    if (s.type === 'intro') return hdr('Week ' + s.week + ' final scores', '', '') +
      board((s.games || []).reduce(function (a, g) { a.push({ t: g.w, tag: 'W', c: [{ v: f1(g.ws), k: 'g' }] }); a.push({ t: g.l, tag: 'L', c: [{ v: f1(g.ls), k: 'dim' }] }); return a; }, []));
    if (s.type === 'play') {
      var fa = s.fant, f = s.from == null ? '–' : s.from + '%', t = s.to == null ? '–' : s.to + '%';
      return hdr(s.label, s.turn ? s.why : '', s.rank ? '#' + s.rank : '') +
        board([{ t: s.title, w: 1, c: [{ v: (s.pts == null ? '' : pts(s.pts)), k: 'g' }] }]) + '<div class="vid"></div>' +
        (fa ? board([{ t: fa.m, tag: fa.ms > fa.os ? 'W' : 'L', c: [{ v: f1(fa.ms), k: fa.ms > fa.os ? 'g' : 'dim' }] }, { t: fa.o, tag: fa.ms > fa.os ? 'L' : 'W', c: [{ v: f1(fa.os), k: 'dim' }] }]) : '') +
        '<div class="wp"><div class="r in"' + ds(2) + ' style="flex:1"><span class="t sm">' + esc(s.by || 'Win') + '’s chance to win</span></div>' +
        '<div class="r"><span class="c dim fl"' + ds(3) + '>' + f + '</span><span class="c g fl"' + ds(5) + '>' + t + '</span></div></div>' +
        '<div class="links"><a href="' + esc(s.replay) + '">Replay in Rumble Central</a></div>';
    }
    if (s.type === 'game') return hdr('Game of the week', s.why, '') +
      board([{ t: s.w, tag: 'W', c: [{ v: f1(s.ws), k: 'g' }] }, { t: s.l, tag: 'L', c: [{ v: f1(s.ls), k: 'dim' }] }]) +
      '<div class="box">' + (s.sides || []).map(function (x, i) { return '<div class="in"' + ds(i + 3) + '><h4>' + esc(x.m) + (x.rec ? '<s>' + esc(x.rec) + '</s>' : '') + '</h4>' +
        (x.lines || []).map(function (l) { return '<p><b>' + esc(l.t) + '</b><u>' + (l.pts == null ? '' : pts(l.pts) + ' pts') + '</u></p>'; }).join('') + '</div>'; }).join('') + '</div>' +
      '';
    if (s.type === 'pod') return hdr('The podcast', s.name || '', s.ep ? 'EP ' + s.ep : '') +
      '<a class="thumb in"' + ds(1) + ' href="' + esc(s.url) + '" target="_blank" rel="noopener" style="background-image:url(https://i.ytimg.com/vi/' + esc(s.vid) + '/hqdefault.jpg)" aria-label="Listen to the episode"></a>' +
      (s.quote ? '<div class="notes in"' + ds(3) + '><h4>Overheard at ' + fmt(s.at) + '</h4><p class="q">“' + esc(s.quote) + '”</p></div>' :
        '');
    if (s.type === 'slack') return hdr('League chat', '', '') +
      board((s.items || []).map(function (x) { return { t: x.t, sub: '#' + x.ch, w: 1, free: 1, c: [{ v: x.n }, { v: x.p, k: 'dim' }] }; }), ['MSGS', 'PEOPLE']);
    if (s.type === 'shotguns') return hdr('Shotgun watch', '', '') +
      board(s.items.map(function (x) { return { t: x.m, sub: x.player + (x.pos ? ' (' + x.pos + ')' : ''), c: [{ v: '0.0', k: 'rd' }] }; }));
    if (s.type === 'records') return hdr('Record book', '', '') +
      board(s.items.map(function (x) { return { t: x.holder, sub: x.name, c: [{ v: x.new, k: 'g' }, { v: x.old || '–', k: 'dim' }] }; }), ['NOW', 'WAS']);
    if (s.type === 'lifetime') return hdr('All-time standings', '', '') +
      board(s.items.map(function (x) { return { t: x.m, sub: x.metric, c: [{ v: (x.delta > 0 ? '▲' : '▼') + Math.abs(x.delta), k: x.delta > 0 ? 'g' : 'rd' }, { v: '#' + x.rank }] }; }), ['MOVE', 'RANK']);
    if (s.type === 'standings') return hdr('Standings', '', 'WK ' + D.week) +
      board(s.rows.map(function (r) {
        var dl = r.prev - r.rank;
        return { t: r.rank + '  ' + r.m, sm: 1, c: [{ v: r.rumbles }, { v: '+' + r.gain, k: 'dim' }, { v: dl ? (dl > 0 ? '▲' : '▼') + Math.abs(dl) : '–', k: dl > 0 ? 'g sm' : dl < 0 ? 'rd sm' : 'dim sm' }] };
      }), ['RUMBLES', 'THIS WK', 'MOVE']);
    if (s.type === 'outro') {
      var n = s.next, when = n ? (n.days === 0 ? 'today' : n.days === 1 ? 'tomorrow' : n.days + ' days') : '';
      return hdr('Next up', '', '') + board([{ t: 'Week ' + s.week, c: [{ v: s.week }] }].concat(n ? [{ t: n.label, sub: n.date, c: [{ v: when, k: n.days <= 3 ? 'rd' : '' }] }] : []));
    }
    return '';
  }
  function toggle() {
    paused = !paused; $('pp').innerHTML = paused ? '&#9654;' : '&#10074;&#10074;';
    try { if (yt && yt.pauseVideo) { paused ? yt.pauseVideo() : yt.playVideo(); } } catch (e) { /* not ready */ }
  }
  $('go').onclick = function () { if (!ready) return; $('cover').hidden = true; started = true; last = performance.now(); go(0); requestAnimationFrame(tick); };
  $('pp').onclick = toggle;
  $('next').onclick = function () { if (ended || !started) return; go(idx + 1); };
  $('prev').onclick = function () { if (!started) return; if (ended) { ended = false; last = performance.now(); go(segs.length - 1); requestAnimationFrame(tick); return; } go(elapsed > 2 ? idx : idx - 1); };
  document.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') $('next').click(); else if (e.key === 'ArrowLeft') $('prev').click(); else if (e.key === ' ' && started) { e.preventDefault(); toggle(); } });
  load();
})();
</script></body></html>
