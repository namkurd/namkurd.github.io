<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<link rel="stylesheet" href="/shell/tokens.css">
<style>
  /* a late-night sports highlight show: brown-orange studio, black name bars, cream score cells, a red band, box-score panels */
  :root { --gold: #f2c14e; --cream: #f6e7b9; --ink: #120a04; --red: #b3171a; --win: #1f8a3c;

    background: linear-gradient(180deg, #3a1a08 0%, #8a4216 22%, #c9692a 55%, #d9892f 100%); }
  .stage::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5; background:

  @media (min-width: 520px) { .stage { border: 2px solid var(--gold); box-shadow: 0 30px 80px -30px #000; height: min(94dvh, 880px); } }

  .bars i { flex: 1; height: 4px; background: #00000066; overflow: hidden; }

  .top { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 7px 12px 6px; flex: none; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
  .top a { color: var(--cream); text-decoration: none; font-weight: 700; }
  .top b { color: var(--gold); font-weight: 800; } .top span { color: var(--cream); font-variant-numeric: tabular-nums; }
  .seg { position: relative; flex: 1; min-height: 0; padding: 4px 12px 8px; display: flex; flex-direction: column; justify-content: center; gap: 10px; animation: segin .35s ease both; }

  @keyframes slide { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
  @keyframes flip { from { transform: rotateX(90deg); opacity: 0; } to { transform: none; opacity: 1; } }

    font-style: normal; font-weight: 900; font-size: 1.15rem; color: var(--ink); letter-spacing: -.05em; box-shadow: 0 3px 8px #0008; }
  .rows { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .r { display: grid; grid-auto-flow: column; grid-template-columns: 1fr; grid-auto-columns: minmax(52px, auto); align-items: stretch; background: var(--ink); border-bottom: 2px solid var(--gold); }
  .r .t { padding: 6px 10px; font-size: 1.45rem; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .r .t.sm { font-size: 1rem; padding: 8px 8px; letter-spacing: 0; }
  .r .t.w { white-space: normal; font-size: 1.2rem; line-height: 1.15; display: flex; align-items: center; }
  .r .t small { display: block; font-size: .7rem; font-weight: 700; color: var(--gold); letter-spacing: .1em; line-height: 1; margin-top: 1px; }
  .r .t em { color: var(--gold); font-style: normal; margin-left: 5px; font-size: 1rem; }

  .notes h4 { margin: 0 0 4px; background: var(--ink); color: var(--gold); padding: 3px 8px; font-size: .95rem; text-transform: uppercase; letter-spacing: .08em; }
  .notes p { margin: 0; padding: 3px 9px; font-size: .95rem; line-height: 1.25; } .notes p b { color: var(--gold); text-transform: uppercase; }
  .notes p.q { font-size: 1.2rem; line-height: 1.3; font-weight: 600; padding: 6px 10px; } .notes small { display: block; padding: 2px 10px; color: var(--cream); opacity: .85; font-size: .74rem; letter-spacing: .04em; text-transform: uppercase; }
  .notes a { color: var(--gold); }
  /* clips */
  .vid { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 3px solid var(--gold); box-shadow: 0 8px 22px #0009; box-sizing: border-box; }
  .vid iframe, .vid > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .links { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; } .links a { color: var(--cream); margin-right: 14px; }
  .wp { display: flex; align-items: stretch; gap: 6px; } .wp .l { align-self: center; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--cream); }
  /* controls */
  .ctl { position: relative; flex: none; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 6px 12px calc(env(safe-area-inset-bottom) + 12px); }
  .ctl button { width: 46px; height: 38px; border: 2px solid var(--gold); background: var(--ink); color: var(--cream); font-size: .95rem; cursor: pointer; }
  .ctl button.p { width: 64px; }
  .cover { position: absolute; inset: 0; z-index: 5; background: linear-gradient(180deg, #2a1206ee, #7a3a12ee 60%, #c9692aee); display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 24px 18px; }
  .cover[hidden] { display: none; }
  .cover button { margin-top: 6px; align-self: center; padding: 13px 34px; border: 3px solid var(--gold); background: var(--ink); color: var(--gold); font-family: var(--cond); font-weight: 800; font-size: 1.15rem; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  .cover button:disabled { opacity: .55; cursor: default; }
  .cover .st { text-align: center; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--cream); } .cover a { text-align: center; color: var(--cream); font-size: .78rem; }
</style></head><body class="dtf-page">
<div class="app"><div class="stage" id="stage">
  <div class="bars" id="bars"></div>
  <div class="top"><a href="/">&larr; Hub</a><b id="ttl">Weekly recap</b><span id="clock"></span></div>
  <div class="seg" id="seg"></div>

  <div class="cover" id="cover">
    <div class="sb"><div class="logo"><i>RH</i></div><div class="rows"><div class="r"><span class="t">Rumble Hub</span><span class="c" id="cw">&nbsp;</span></div><div class="r"><span class="t" id="ch">Recap</span><span class="c dim" id="cs">&nbsp;</span></div></div></div>

</div></div>
<script>

  var D = null, raw = [], segs = [], idx = -1, paused = false, elapsed = 0, last = 0, yt = null, ytApi = null, started = false, ended = false, cur = null, ready = false;

        var holder = document.createElement('div'), slot = document.createElement('div'), pl = null, done = false, timer;
