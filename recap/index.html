<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Recap</title>
<link rel="stylesheet" href="/shell/tokens.css">
<style>
  :root { --g: #22c55e; --gold: #facc15; --red: #ef4444; }
  html, body { height: 100%; }
  body { margin: 0; background: #0b0d11; overflow: hidden; }
  .app { height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .stage { position: relative; width: min(100vw, 470px); height: min(100dvh, 880px); display: flex; flex-direction: column; background:
    radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, var(--g) 16%, transparent), transparent 70%), var(--dtf-bg); overflow: hidden; }
  @media (min-width: 520px) { .stage { border-radius: 22px; border: 1px solid var(--dtf-border); box-shadow: 0 30px 80px -30px #000; height: min(94dvh, 880px); } }
  .bars { display: flex; gap: 3px; padding: calc(env(safe-area-inset-top) + 10px) 12px 0; flex: none; }
  .bars i { flex: 1; height: 3px; border-radius: 2px; background: #ffffff26; overflow: hidden; }
  .bars i b { display: block; height: 100%; width: 0; background: #fff; }
  .bars i.done b { width: 100%; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px 0; flex: none; font-size: .78rem; color: var(--dtf-dim); }
  .top a { color: var(--dtf-dim); text-decoration: none; font-weight: 600; }
  .top b { color: var(--dtf-text); letter-spacing: .05em; text-transform: uppercase; font-size: .72rem; }
  .seg { flex: 1; min-height: 0; padding: 12px 18px 8px; display: flex; flex-direction: column; justify-content: center; gap: 12px; animation: segin .35s ease both; }
  @keyframes segin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
  .pop { opacity: 0; animation: pop .45s ease forwards; }
  .kick { font-size: .74rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--g); }
  h2.big { margin: 0; font-size: 2.3rem; line-height: 1.05; letter-spacing: -.02em; }
  .dim { color: var(--dtf-dim); }
  .chips { display: flex; flex-direction: column; gap: 9px; margin-top: 6px; }
  .chip { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--dtf-panel); border: 1px solid var(--dtf-border); }
  .chip em { font-style: normal; color: var(--dtf-dim); font-size: .82rem; }
  .chip b { font-size: 1.55rem; }
  .chip span { font-size: .85rem; color: var(--dtf-text); font-weight: 700; margin-left: 8px; }
  .hook { font-size: .95rem; color: var(--dtf-text); }
  /* plays */
  .vid { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid var(--dtf-border); }
  .vid iframe, .vid > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .vid .fb { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: #11141a; color: var(--dtf-dim); text-align: center; padding: 10px; }
  .vid .fb a { color: #fff; background: #ff3b30; padding: 8px 14px; border-radius: 20px; font-weight: 700; text-decoration: none; }
  .ptitle { font-size: 1.5rem; font-weight: 800; line-height: 1.15; margin: 0; }
  .pts { display: inline-block; font-weight: 800; color: var(--g); font-size: 1.25rem; text-shadow: 0 0 14px color-mix(in srgb, var(--g) 55%, transparent); }
  .row2 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .wp { position: relative; height: 26px; border-radius: 13px; background: var(--dtf-panel); border: 1px solid var(--dtf-border); overflow: hidden; }
  .wp .a { position: absolute; left: 0; top: 0; bottom: 0; width: var(--f); background: color-mix(in srgb, var(--g) 35%, transparent); transition: width 1.4s cubic-bezier(.2,.8,.2,1) .5s; }
  .wp .a.go { width: var(--t); }
  .wp .m { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #ffffff40; }
  .wp span { position: absolute; top: 3px; font-size: .78rem; font-weight: 800; }
  .wp .l { left: 10px; } .wp .r { right: 10px; color: var(--dtf-text); }
  .fant { font-size: .85rem; color: var(--dtf-dim); }
  .fant b { color: var(--dtf-text); }
  .links { font-size: .74rem; } .links a { color: var(--dtf-dim); margin-right: 12px; }
  /* game */
  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
  .score .n { font-size: 1.15rem; font-weight: 800; } .score .v { font-size: 2.2rem; font-weight: 900; letter-spacing: -.02em; }
  .score .w .v { color: var(--g); } .score .l .v { color: var(--dtf-dim); } .score i { font-style: normal; color: var(--dtf-dim); }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .li { display: flex; justify-content: space-between; gap: 8px; padding: 9px 12px; border-radius: 12px; background: var(--dtf-panel); border: 1px solid var(--dtf-border); font-size: .92rem; }
  .li b { color: var(--g); }
  .rec .old { color: var(--dtf-dim); font-size: .8rem; text-decoration: line-through; }
  /* standings */
  .st { display: flex; flex-direction: column; gap: 4px; }
  .sr { display: grid; grid-template-columns: 26px 1fr auto 56px; align-items: center; gap: 8px; padding: 7px 11px; border-radius: 11px; background: var(--dtf-panel); border: 1px solid var(--dtf-border); font-size: .92rem; }
  .sr .rk { color: var(--dtf-dim); font-weight: 700; } .sr .nm { font-weight: 700; }
  .up { color: var(--g); font-weight: 800; font-size: .8rem; } .dn { color: var(--red); font-weight: 800; font-size: .8rem; }
  .sr .tt { text-align: right; font-weight: 800; }
  .sr.hot { border-color: color-mix(in srgb, var(--g) 55%, var(--dtf-border)); box-shadow: 0 0 18px -8px var(--g); }
  /* controls */
  .ctl { flex: none; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 6px 12px calc(env(safe-area-inset-bottom) + 12px); }
  .ctl button { width: 46px; height: 40px; border-radius: 20px; border: 1px solid var(--dtf-border); background: var(--dtf-panel); color: var(--dtf-text); font-size: 1rem; cursor: pointer; }
  .ctl button.p { width: 64px; }
  .ctl small { color: var(--dtf-dim); font-size: .72rem; min-width: 50px; text-align: center; }
  .cover { position: absolute; inset: 0; z-index: 5; background: radial-gradient(100% 60% at 50% 20%, color-mix(in srgb, var(--g) 22%, transparent), #0b0d11e6 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  .cover h1 { margin: 0; font-size: 2.6rem; line-height: 1; letter-spacing: -.02em; }
  .cover button { margin-top: 8px; padding: 14px 30px; border-radius: 30px; border: 0; background: var(--g); color: #04210f; font-weight: 800; font-size: 1.05rem; cursor: pointer; }
  .cover[hidden] { display: none; }
  .cover a { color: var(--dtf-dim); font-size: .82rem; }
</style></head><body class="dtf-page">
<div class="app"><div class="stage" id="stage">
  <div class="bars" id="bars"></div>
  <div class="top"><a href="/">&larr; Hub</a><b id="ttl">Weekly recap</b><span id="clock"></span></div>
  <div class="seg" id="seg"></div>
  <div class="ctl"><button id="prev" aria-label="Previous">&#9664;</button><button id="pp" class="p" aria-label="Pause">&#10074;&#10074;</button><button id="next" aria-label="Next">&#9654;</button></div>
  <div class="cover" id="cover"><div class="kick">Rumble Hub</div><h1 id="ch">Weekly recap</h1><div class="dim" id="cs"></div><button id="go">&#9654; Watch</button><a href="/">Back to the Hub</a></div>
</div></div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var D = null, segs = [], idx = -1, paused = false, elapsed = 0, last = 0, yt = null, ytReady = null, started = false, ended = false, cur = null;

  function wk() { var m = /[?&]week=(\d+)/.exec(location.search); return m ? m[1] : ''; }
  function load() {
    var w = wk(), urls = w ? ['/data/recap_' + w + '.json', '/data/recap.json'] : ['/data/recap.json'];
    (function next(i) {
      if (i >= urls.length) { $('cs').textContent = 'No recap yet.'; $('go').hidden = true; return; }
      fetch(urls[i], { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) { D = d; segs = d.segments || []; init(); }, function () { next(i + 1); });
    })(0);
  }
  function init() {
    var t = 'Week ' + D.week + ' recap'; document.title = t + ' · Rumble Hub'; $('ch').textContent = t; $('ttl').textContent = t;
    var s = D.seconds || segs.reduce(function (a, x) { return a + x.dur; }, 0);
    $('cs').textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2) + ' · ' + segs.filter(function (x) { return x.type === 'play'; }).length + ' clips';
    $('bars').innerHTML = segs.map(function () { return '<i><b></b></i>'; }).join('');
  }
  function api() {   // the YouTube IFrame API, loaded once
    if (ytReady) return ytReady;
    return ytReady = new Promise(function (res, rej) {
      if (window.YT && YT.Player) return res(window.YT);
      window.onYouTubeIframeAPIReady = function () { res(window.YT); };
      var sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; sc.onerror = rej; document.head.appendChild(sc); setTimeout(rej, 12000);
    });
  }
  function clock() {
    var tot = 0; segs.forEach(function (s, i) { if (i < idx) tot += s.dur; }); tot += Math.min(elapsed, cur ? cur.dur : 0);
    var all = D.seconds || 0, left = Math.max(0, all - Math.round(tot));
    $('clock').textContent = Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2);
  }
  function tick(now) {
    if (!started || ended) return;
    if (!paused && cur) {
      elapsed += (now - last) / 1000;
      var b = $('bars').children[idx]; if (b) b.firstChild.style.width = Math.min(100, elapsed / cur.dur * 100) + '%';
      if (elapsed >= cur.dur + (cur.type === 'play' ? 3 : 0)) { go(idx + 1); }
      clock();
    }
    last = now; requestAnimationFrame(tick);
  }
  function stopVideo() { try { if (yt && yt.destroy) yt.destroy(); } catch (e) { /* gone already */ } yt = null; }
  function go(i) {
    if (i < 0) i = 0;
    stopVideo();
    if (i >= segs.length) { finish(); return; }
    idx = i; cur = segs[i]; elapsed = 0;
    [].forEach.call($('bars').children, function (b, k) { b.className = k < i ? 'done' : ''; b.firstChild.style.width = ''; });
    $('seg').innerHTML = render(cur); $('seg').style.animation = 'none'; void $('seg').offsetWidth; $('seg').style.animation = '';
    if (cur.type === 'play') startClip(cur.clip, cur.alt, 0);
    requestAnimationFrame(function () { [].forEach.call(document.querySelectorAll('.wp .a'), function (a) { a.classList.add('go'); }); });
    clock();
  }
  function fallback(seg) {
    var v = document.querySelector('.vid'); if (!v) return;
    v.innerHTML = '<div class="fb"><span>This clip can’t play here</span><a href="' + esc(seg.href) + '" target="_blank" rel="noopener">Watch on YouTube</a></div>';
    cur.dur = Math.min(cur.dur, 7); // don't hold a card with no video
  }
  function startClip(c, alt, tries) {
    var seg = cur;
    api().then(function (YT) {
      if (cur !== seg) return;
      var slot = document.createElement('div'); var v = document.querySelector('.vid'); if (!v) return; v.innerHTML = ''; v.appendChild(slot);
      var vars = { autoplay: 1, playsinline: 1, controls: 0, rel: 0, modestbranding: 1, start: Math.floor(c.s) };
      if (c.e && c.s !== 0) vars.end = Math.ceil(c.e);
      yt = new YT.Player(slot, { host: 'https://www.youtube-nocookie.com', videoId: c.id, playerVars: vars, events: {
        onReady: function (e) { if (paused) e.target.pauseVideo(); else e.target.playVideo(); },
        onStateChange: function (e) { if (e.data === 0 && cur === seg && !paused) go(idx + 1); },
        onError: function () { if (cur !== seg) return; if (alt && !tries) { seg.clip = alt; startClip(alt, null, 1); } else fallback(seg); }
      } });
    }, function () { if (cur === seg) fallback(seg); });
  }
  function finish() {
    ended = true; stopVideo(); [].forEach.call($('bars').children, function (b) { b.className = 'done'; });
    $('seg').innerHTML = '<div class="kick pop">That’s the week</div><h2 class="big pop" style="animation-delay:.1s">See you next Tuesday.</h2><div class="list pop" style="animation-delay:.2s"><a class="li" href="#" id="again">↺ Watch again</a><a class="li" href="/">The Rumble Hub</a><a class="li" href="/SleeperLiveRumbles/rumbles.html">Rumble Central</a></div>';
    $('again').onclick = function (e) { e.preventDefault(); ended = false; started = true; last = performance.now(); go(0); requestAnimationFrame(tick); };
    $('clock').textContent = '';
  }
  function ord(n) { return n; }
  function render(s) {
    var d = function (i) { return ' style="animation-delay:' + (i * .12 + .1).toFixed(2) + 's"'; };
    if (s.type === 'intro') return '<div class="kick pop">Rumble Hub · ' + esc(s.season) + '</div><h2 class="big pop"' + d(1) + '>Week ' + esc(s.week) + '<br>recap</h2><div class="chips">' +
      (s.stats || []).map(function (c, i) { return '<div class="chip pop"' + d(i + 2) + '><em>' + esc(c.k) + '</em><span style="margin-left:auto;text-align:right"><b>' + esc(c.v) + '</b> ' + esc(c.m) + '</span></div>'; }).join('') +
      '</div>' + (s.hook ? '<div class="hook pop"' + d(6) + '>' + esc(s.hook) + '</div>' : '');
    if (s.type === 'play') {
      var f = s.from == null ? 50 : s.from, t = s.to == null ? 50 : s.to, fa = s.fant, sit = s.sit;
      return '<div class="kick">' + esc(s.label) + '</div><div class="vid"></div><h3 class="ptitle pop"' + d(1) + '>' + esc(s.title) + '</h3>' +
        '<div class="row2 pop"' + d(2) + '><span class="pts">' + (s.pts == null ? '' : (s.pts >= 0 ? '+' : '−') + Math.abs(s.pts).toFixed(1) + ' pts') + '</span><span class="dim" style="font-size:.85rem">' + esc(s.by || '') + (s.et ? ' · ' + esc(s.et.replace(/ ([AP])M$/, function (m, x) { return x.toLowerCase(); })) : '') + '</span></div>' +
        '<div class="wp pop"' + d(3) + ' title="Win probability"><div class="a" style="--f:' + f + '%;--t:' + t + '%;width:' + f + '%"></div><i class="m"></i><span class="l">' + f + '%</span><span class="r">→ ' + t + '%</span></div>' +
        (fa ? '<div class="fant pop"' + d(4) + '><b>' + esc(fa.m) + '</b> ' + fa.ms.toFixed(1) + ' – ' + fa.os.toFixed(1) + ' ' + esc(fa.o) + '</div>' : '<div class="fant pop"' + d(4) + '>' + esc(s.sub) + '</div>') +
        (s.why ? '<div class="fant pop"' + d(4) + '>' + esc(s.why) + '</div>' : '') +
        '<div class="links"><a href="' + esc(s.replay) + '">Replay in Rumble Central</a><a href="' + esc(s.href) + '" target="_blank" rel="noopener">On YouTube</a></div>';
    }
    if (s.type === 'game') return '<div class="kick">' + esc(s.title) + '</div><div class="score pop"' + d(1) + '><div class="w"><div class="n">' + esc(s.w) + '</div><div class="v">' + s.ws.toFixed(1) + '</div></div><i>vs</i><div class="l"><div class="n">' + esc(s.l) + '</div><div class="v">' + s.ls.toFixed(1) + '</div></div></div>' +
      '<h2 class="big pop"' + d(2) + ' style="font-size:1.6rem;text-align:center;animation-delay:.3s">' + esc(s.why) + '</h2><div class="dim pop" style="text-align:center;animation-delay:.4s">' + (s.flips ? s.flips + ' lead changes' : '') + '</div>' +
      '<div class="list">' + (s.others || []).map(function (g, i) { return '<div class="li pop"' + d(i + 4) + '><span><b>' + esc(g.w) + '</b> ' + g.ws.toFixed(1) + '</span><span class="dim">' + g.ls.toFixed(1) + ' ' + esc(g.l) + '</span></div>'; }).join('') + '</div>';
    if (s.type === 'shotguns') return '<div class="kick" style="color:var(--red)">' + esc(s.title) + '</div><h2 class="big pop"' + d(1) + '>Zeroes in the lineup</h2><div class="list">' + s.items.map(function (x, i) { return '<div class="li pop"' + d(i + 2) + '><span><b style="color:var(--red)">' + esc(x.m) + '</b> started ' + esc(x.player) + '</span><span class="dim">' + esc(x.pos || '') + ' · 0.0</span></div>'; }).join('') + '</div>';
    if (s.type === 'records') return '<div class="kick" style="color:var(--gold)">' + esc(s.title) + '</div><h2 class="big pop"' + d(1) + '>Record book<br>just changed</h2><div class="list rec">' + s.items.map(function (x, i) { return '<div class="li pop"' + d(i + 2) + '><span><b style="color:var(--gold)">' + esc(x.name) + '</b><br><span class="dim">' + esc(x.holder) + '</span></span><span style="text-align:right"><b style="color:var(--g)">' + esc(x.new) + '</b><br><span class="old">' + esc(x.old || '') + '</span></span></div>'; }).join('') + '</div>';
    if (s.type === 'lifetime') return '<div class="kick" style="color:#34d399">' + esc(s.title) + '</div><h2 class="big pop"' + d(1) + '>All-time<br>movers</h2><div class="list">' + s.items.map(function (x, i) { var up = x.delta > 0;
      return '<div class="li pop"' + d(i + 2) + '><span><b style="color:' + (up ? 'var(--g)' : 'var(--red)') + '">' + (up ? '\u25B2' : '\u25BC') + Math.abs(x.delta) + '</b> ' + esc(x.m) + '<br><span class="dim" style="font-size:.8rem">' + esc(x.metric) + '</span></span><span style="font-size:1.3rem;font-weight:800">#' + x.rank + '</span></div>'; }).join('') + '</div>';
    if (s.type === 'standings') return '<div class="kick">' + esc(s.title) + '</div><div class="st">' + s.rows.map(function (r, i) {
      var dl = r.prev - r.rank, mv = dl > 0 ? '<span class="up">▲' + dl + '</span>' : dl < 0 ? '<span class="dn">▼' + (-dl) + '</span>' : '<span class="dim">–</span>';
      return '<div class="sr pop' + (dl >= 2 ? ' hot' : '') + '" style="animation-delay:' + (i * .09 + .1).toFixed(2) + 's"><span class="rk">' + r.rank + '</span><span class="nm">' + esc(r.m) + '</span>' + mv + '<span class="tt">' + r.rumbles + ' <span class="dim" style="font-weight:600;font-size:.74rem">+' + r.gain + '</span></span></div>';
    }).join('') + '</div>';
    if (s.type === 'outro') {
      var n = s.next, when = n ? (n.days === 0 ? 'today' : n.days === 1 ? 'tomorrow' : 'in ' + n.days + ' days') : '';
      return '<div class="kick">' + esc(s.title) + '</div><h2 class="big pop"' + d(1) + '>Week ' + esc(s.week) + '</h2>' + (n ? '<div class="chip pop"' + d(2) + '><em>' + esc(n.label) + '</em><span><b>' + esc(when) + '</b></span></div>' : '') +
        (s.pod ? '<a class="chip pop"' + d(3) + ' href="' + esc(s.pod.url) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><em>Latest podcast</em><span>' + esc(s.pod.title) + '</span></a>' : '');
    }
    return '';
  }
  function toggle() {
    paused = !paused; $('pp').innerHTML = paused ? '&#9654;' : '&#10074;&#10074;';
    try { if (yt && yt.pauseVideo) { paused ? yt.pauseVideo() : yt.playVideo(); } } catch (e) { /* not ready */ }
  }
  $('go').onclick = function () { $('cover').hidden = true; started = true; last = performance.now(); go(0); requestAnimationFrame(tick); };
  $('pp').onclick = toggle;
  $('next').onclick = function () { if (ended) return; go(idx + 1); };
  $('prev').onclick = function () { if (ended) { ended = false; started = true; last = performance.now(); go(segs.length - 1); requestAnimationFrame(tick); return; } go(elapsed > 2 ? idx : idx - 1); };
  document.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') $('next').click(); else if (e.key === 'ArrowLeft') $('prev').click(); else if (e.key === ' ' && started) { e.preventDefault(); toggle(); } });
  load();
})();
</script></body></html>
