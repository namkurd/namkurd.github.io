<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-style: normal; font-display: swap; src: url(/recap/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2"); }

  /* a late-night sports highlight show: brown-orange studio, red header bars, black name bars, cream score cells, box-score panels */
  :root { --gold: #f2c14e; --cream: #f6e7b9; --ink: #120a04; --red: #d02027; --red2: #8f0f14; --win: #1f8a3c;

    background: linear-gradient(180deg, #2c1306 0%, #7a3a12 20%, #bb5f26 55%, #cf822e 100%); }

  .bars i.done b { width: 100%; } .bars i.cur::before { background: #00000099; }
  .top { position: relative; display: flex; align-items: center; gap: 8px; padding: 2px 8px 6px 12px; flex: none; font-size: .9rem; letter-spacing: .08em; text-transform: uppercase; }
  .top a, .top button { color: var(--cream); text-decoration: none; font-weight: 700; flex: none; background: none; border: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 6px 4px; }

  .seg { position: relative; flex: 1; min-height: 0; padding: 4px 12px 8px; display: flex; flex-direction: column; justify-content: center; gap: 10px; animation: segin .35s ease both; }
  .seg.play { justify-content: flex-start; padding-top: 0; }

  /* header: every card opens with a red title bar */

  /* around the league: scoreboard tiles */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--ink); border-bottom: 3px solid var(--gold); }

  .tug { display: flex; gap: 3px; height: 66px; } .tug > div { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; min-width: 0; font-weight: 900; text-transform: uppercase; }
  .tug .w { background: linear-gradient(180deg, #3fae62, var(--win)); } .tug .l { background: linear-gradient(180deg, #5a4a30, #3b2f1c); color: #e8dcc0; }

  .hero .hv { font-size: 4.2rem; font-weight: 900; line-height: 1; color: var(--gold); text-shadow: 0 3px 0 #0008; margin-top: 4px; } .hero .hn { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; } .hero .hw { color: var(--cream); font-size: 1rem; }

  .topic { background: var(--ink); border-bottom: 2px solid var(--gold); padding: 6px 10px 7px; } .topic b { display: block; font-size: 1.2rem; line-height: 1.15; margin: 4px 0 5px; font-weight: 700; }

  .tr .axis { margin-top: 2px; }

  .tgw { display: flex; flex-direction: column; gap: 5px; } .tcol.dup .tgh { display: none; } .tg { display: flex; flex-direction: column; gap: 5px; } .tc { background: var(--ink); border-left: 4px solid #5a4a30; padding: 2px 8px 3px; } .tc.ok { border-left-color: var(--win); } .tc.no { border-left-color: var(--red); }

  .tc .sv { font-size: .74rem; font-weight: 900; text-align: center; padding: 0 3px; background: #5a4a30; color: #e8dcc0; white-space: nowrap; } .tc .sv.pos { background: var(--win); color: #fff; } .tc .sv.neg { background: var(--red); color: #fff; } .tc .sv.none { background: none; }

  /* clinch watch */
  .sc { background: var(--ink); border-bottom: 3px solid var(--gold); padding: 6px 10px 8px; }
  .sc .sh { display: flex; align-items: center; gap: 12px; } .sc .sh .c { font-size: 2.6rem; font-weight: 900; min-width: 78px; text-align: center; padding: 0 6px; line-height: 1.15; background: linear-gradient(180deg, #6ed28a, var(--win)); color: #fff; } .sc .sh .c.rd { background: linear-gradient(180deg, #ee5a5f, var(--red2)); }
  .sc .sh b { display: block; font-size: 1.6rem; text-transform: uppercase; line-height: 1.05; } .sc .sh small { display: block; color: var(--gold); font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

  .cd { background: linear-gradient(180deg, #0007, #0003); border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); padding: 8px 12px 10px; text-align: center; }
  .cd .hk { display: inline-block; background: var(--red); padding: 2px 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; font-size: .95rem; }

  .mc em { display: block; font-style: normal; font-size: 1.25rem; font-weight: 800; color: #fff; margin-top: 2px; } .mc s { display: block; text-decoration: none; font-size: .85rem; color: var(--cream); }

  .rd p { margin: 0; display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: center; background: #00000055; border-bottom: 2px solid var(--gold); padding: 8px 10px 8px 0; font-size: 1.35rem; font-weight: 700; line-height: 1.15; }

    if (e.target.closest('a, button, .vid')) return;
    downX = e.clientX; downAt = Date.now(); heldNow = false;
    holdT = setTimeout(function () { heldNow = true; held = true; applyPause(); }, 320);
  });
  function release(e) {
    clearTimeout(holdT);
    if (heldNow) { held = false; heldNow = false; applyPause(); return; }
    if (!e || !started || ended || e.type === 'pointercancel' || Date.now() - downAt > 320 || e.target.closest('a, button, .vid')) return;
    var r = $('seg').getBoundingClientRect(), x = (downX - r.left) / r.width;
    if (x < .3) $('prev').click(); else if (x > .7) $('next').click();
  }
  $('seg').addEventListener('pointerup', release); $('seg').addEventListener('pointercancel', release);
  $('ttl').onclick = function () {
    var sh = $('sheet'); if (!sh.hidden) { sh.hidden = true; return; }
    var list = full ? segs : raw.filter(function (x) { return x.type !== 'clips'; });
    sh.innerHTML = list.map(function (s, i) { return '<button type="button" data-i="' + i + '" class="' + (i === idx ? 'on' : '') + '"><small>' + (i + 1) + '</small>' + esc(s.type === 'play' ? (s.turn ? 'Turning point' : '#' + s.rank + ' ' + s.title) : (NAMES[s.type] || s.title || '')) + '</button>'; }).join('');
    sh.hidden = false;
  };
  $('sheet').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; $('sheet').hidden = true; ended = false; if (!started) begin(Number(b.dataset.i)); else go(Number(b.dataset.i)); });
  document.addEventListener('click', function (e) { if (!e.target.closest('#sheet, #ttl')) $('sheet').hidden = true; });
  function toast(t) { var el = $('toast'); el.textContent = t; el.hidden = false; setTimeout(function () { el.hidden = true; }, 1800); }
  $('share').onclick = function () {
    var url = location.origin + location.pathname + '?week=' + D.week + (idx > 0 ? '#' + idx : ''), title = 'Week ' + D.week + ' recap';
    if (navigator.share) navigator.share({ title: title, url: url }).catch(function () { /* cancelled */ });
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }, function () { toast(url); });
    else toast(url);
  };
  document.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') $('next').click(); else if (e.key === 'ArrowLeft') $('prev').click(); else if (e.key === ' ' && started) { e.preventDefault(); toggle(); } else if (e.key === 'Escape') $('sheet').hidden = true; });
  load();
})();
