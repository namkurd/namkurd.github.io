<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumble Hub</title>
<link rel="stylesheet" href="/shell/tokens.css">
<style>
  /* Home fits one screen on a phone: header, the eight tool tiles (big), and a compact tabbed feed. Sizes follow the screen height. */
  /* sizes follow the space between the bars (screen minus status bar, notch and tab bar), so the installed app fits as well as a browser tab */
  .dtf-wrap { padding: 10px 16px 6px; --avail: calc(100dvh - var(--dtf-top-pad, 0px) - var(--dtf-nav-h, 56px)); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 0 2px; }
  h1.home { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
  .me { flex: none; height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--dtf-border); background: var(--dtf-panel); color: var(--dtf-dim); font-family: inherit; font-size: .76rem; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .me.set { color: var(--dtf-text); border-color: color-mix(in srgb, var(--dtf-accent) 55%, var(--dtf-border)); }
  .me.ask { color: var(--dtf-accent); border-color: var(--dtf-accent); }
  .next { margin: 0 0 8px; font-size: .78rem; color: var(--dtf-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .next b { color: var(--dtf-text); font-weight: 600; }
  .next[hidden] { display: none; }

  /* four equal tiles per row, two rows; Champions & Sackos spans the full width */
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(4px, calc(var(--avail) * .007), 10px); --plate: clamp(26px, calc(var(--avail) * .046), 62px); }
  /* each tool has its own colour (--c, optional --c2) from tools.json: tinted glow, gradient edge, dark logo plate */
  .dtf-wrap a.tile { color: var(--dtf-text); }
  .tile { --c2: var(--c); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: clamp(4px, calc(var(--avail) * .0065), 12px) 3px clamp(3px, calc(var(--avail) * .005), 10px); border-radius: 16px; text-decoration: none;
    border: 1.5px solid transparent; -webkit-tap-highlight-color: transparent; transition: transform .12s ease, box-shadow .2s ease;
    background:
      radial-gradient(120% 85% at 50% 0%, color-mix(in srgb, var(--c) 24%, transparent), transparent 72%) padding-box,
      linear-gradient(var(--dtf-panel), var(--dtf-panel)) padding-box,
      linear-gradient(140deg, color-mix(in srgb, var(--c) 75%, transparent), color-mix(in srgb, var(--c2) 75%, transparent)) border-box;
    box-shadow: 0 10px 26px -16px color-mix(in srgb, var(--c) 70%, transparent); }
  .tile.wide { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 12px; text-align: left; padding-top: 3px; padding-bottom: 3px; }
  .tile.wide .plate { --plate: clamp(26px, calc(var(--avail) * .036), 38px); flex: none; }
  .tile.wide b { margin-top: 0; } .tile.wide .t { display: block; font-size: .78rem; }
  .tr { height: 1.3em; width: auto; vertical-align: -.3em; }
  .tile.wide .t b { font-size: inherit; margin: 0; color: var(--dtf-text); }
  .tile.wide .wb { display: flex; flex-direction: column; min-width: 0; }
  /* IR eligibility status (from FAB's IR check) */
  .ir { display: inline-block; width: auto; max-width: 100%; margin: 0 0 5px; padding: 2px 9px; border: 1px solid var(--dtf-border); border-radius: 10px; background: var(--dtf-panel); color: var(--dtf-text); font: inherit; font-size: .72rem; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .ir[hidden] { display: none; }
  .ir .tx { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .ir.open .tx { white-space: normal; }
  .ir.bad { border-color: #e5484d; background: color-mix(in srgb, #e5484d 14%, var(--dtf-panel)); } .ir.warn { border-color: #e0a23a; background: color-mix(in srgb, #e0a23a 12%, var(--dtf-panel)); }
  .ir b { font-weight: 700; } .ir .dim { color: var(--dtf-dim); }
  .tile:active { transform: scale(.97); }
  @media (hover: hover) { .tile:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -14px color-mix(in srgb, var(--c) 80%, transparent); } }
  .tile:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }
  .plate { width: var(--plate); height: var(--plate); display: grid; place-items: center; border-radius: 24%;
    background: linear-gradient(150deg, color-mix(in srgb, var(--c) 32%, #0f1115), color-mix(in srgb, var(--c2) 12%, #0f1115));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent), inset 0 -14px 24px -16px color-mix(in srgb, var(--c2) 60%, transparent); }
  .plate img { width: calc(var(--plate) * .78); height: calc(var(--plate) * .78); display: block; object-fit: contain; }
  .tile b { margin-top: 3px; font-size: .64rem; line-height: 1.12; white-space: nowrap; max-width: 100%; }
  .tile .t { display: none; font-size: .78rem; line-height: 1.25; color: var(--dtf-dim); }

  .feed { margin-bottom: clamp(5px, calc(var(--avail) * .011), 12px); background: var(--dtf-panel); border: 1px solid var(--dtf-border); border-radius: 18px; padding: 8px 10px 6px; }
  .feed[hidden] { display: none; }
  .tabs { display: flex; gap: 2px; padding: 2px; margin-bottom: 4px; background: color-mix(in srgb, var(--dtf-bg) 70%, transparent); border-radius: 12px; }
  .tabs button { flex: 1 1 auto; min-width: 0; height: 32px; padding: 0 8px; border: 0; border-radius: 10px; background: none; color: var(--dtf-dim); font-weight: 600; font-size: .74rem; line-height: 1; font-family: inherit; white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .tabs button[aria-selected="true"] { background: var(--dtf-panel); color: var(--dtf-text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ac) 55%, transparent); }
  .panel { display: none; --ac: var(--dtf-accent); }
  .panel.on { display: block; }
  .panel h2 { margin: 2px 4px 0; font-size: .86rem; font-weight: 700; text-transform: none; letter-spacing: 0; color: var(--dtf-text); }
  .panel .cap { display: block; margin: 0 4px 4px; font-size: .7rem; line-height: 1.25; color: var(--dtf-dim); }
  .row.mine { background: color-mix(in srgb, var(--ac) 10%, transparent); box-shadow: inset 3px 0 0 var(--ac); }
  .you { margin-left: 6px; padding: 1px 6px; border-radius: 8px; background: var(--ac); color: #0f1115; font-size: .62rem; font-weight: 800; vertical-align: 1px; }
  /* a trade: who is winning, then every player each side gets (the line shrinks to fit) */
  .row.trade { grid-template-columns: 30px minmax(0, 1fr) 12px; }
  .rkc { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .wkn { font-size: .6rem; font-style: normal; line-height: 1; color: var(--dtf-dim); white-space: nowrap; }
  .tline { display: flex; align-items: center; justify-content: space-between; gap: 8px; }   /* title left, winner tag right, on every trade */
  .tline b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .win { flex: none; white-space: nowrap; padding: 1px 8px; border-radius: 9px; background: color-mix(in srgb, var(--ac) 22%, transparent); color: var(--ac); font-size: .7rem; font-weight: 700; }
  .win.even { background: color-mix(in srgb, var(--dtf-dim) 20%, transparent); color: var(--dtf-dim); }
  .trade .gets { display: block; white-space: nowrap; overflow: hidden; text-overflow: clip; font-size: .72rem; color: var(--dtf-dim); }
  .trade .gets i { font-style: normal; color: var(--dtf-text); }
  .trade .gets.wrap { white-space: normal; }
  .dtf-wrap a.row { color: var(--dtf-text); }
  .row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 12px; align-items: center; gap: 9px; min-height: clamp(34px, calc(var(--avail) * .05), 40px); padding: 2px 4px; border-radius: 10px; text-decoration: none; color: var(--dtf-text); -webkit-tap-highlight-color: transparent; }
  .row:active, .row:hover { background: color-mix(in srgb, var(--ac) 12%, transparent); }
  .row .rk { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--ac) 24%, transparent); color: var(--ac); font-size: .72rem; font-weight: 700; }
  .row b { display: block; font-size: .84rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.mu b, .row.mu small { white-space: nowrap; text-overflow: clip; }
  .row.slack b { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.2; }
  .row small { display: block; font-size: .72rem; color: var(--dtf-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .go { color: var(--dtf-dim); font-size: .9rem; }
  .none { margin: 8px 4px; color: var(--dtf-dim); font-size: .8rem; }
  .meta { margin: 2px 4px 0; font-size: .68rem; color: var(--dtf-dim); text-align: right; }
  .meta .old { color: #e0a23a; }
  .foot { margin: 8px 0 2px; text-align: center; font-size: .8rem; }
  .foot[hidden] { display: none; }

  @media (min-width: 900px) {
    .dtf-wrap { max-width: 1200px; padding-top: 14px; }
    h1.home { font-size: 1.6rem; } .next { font-size: .9rem; }
    .grid { gap: clamp(6px, calc(var(--avail) * .012), 14px); --plate: clamp(34px, calc(var(--avail) * .044), 76px); }
    .tile { padding: clamp(6px, calc(var(--avail) * .008), 16px) 10px clamp(6px, calc(var(--avail) * .006), 15px); gap: 3px; } .tile b { font-size: 1rem; margin-top: clamp(2px, calc(var(--avail) * .006), 8px); } .tile .t { display: block; }
  }
  /* wide screens: all five lists side by side (narrower ones keep the tabs) */
  @media (min-width: 1100px) {
    .feed { margin-bottom: clamp(6px, calc(var(--avail) * .014), 18px); padding: 5px 16px 3px; }
    .tabs { display: none; }
    .panels { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 18px; }
    .panel, .panel.on { display: block; } .panel h2 { color: var(--ac); text-transform: uppercase; letter-spacing: .06em; font-size: .78rem; }
    .row { align-items: start; padding: 2px 4px; } .row .rk { margin-top: 2px; } .row .go { margin-top: 4px; }
    .row b { font-size: .88rem; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .row.mu b { display: block; white-space: nowrap; overflow: hidden; text-overflow: clip; }
    .row.slack b { -webkit-line-clamp: 3; font-size: .8rem; }   /* the Slack column is the shortest: let summaries use three lines instead of shrinking to nothing */
    .row:not(.trade) small { white-space: nowrap; }   /* one line: with five columns the sublines would otherwise wrap and push the page past one screen */
    .trade small { white-space: normal; }
    .trade b { display: block; -webkit-line-clamp: unset; }
    .trade .tline { flex-direction: column; align-items: flex-start; gap: 3px; }   /* columns are narrow: title, then its winner tag, on every trade */
    .trade .tline b { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  }
  /* below the tiles: the latest podcast episode (a small embedded player) and this season's Shotguns, both kept short so Home fits one screen */
  .lower { display: grid; gap: clamp(4px, calc(var(--avail) * .008), 10px); margin-top: clamp(4px, calc(var(--avail) * .008), 10px); }
  .card { background: var(--dtf-panel); border: 1px solid var(--dtf-border); border-radius: 14px; padding: 6px 9px 7px; min-width: 0; }
  .card[hidden] { display: none; }
  .card .k { font-size: .62rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dtf-accent); }
  .card .k .cbc { width: 1.55em; height: 1.55em; vertical-align: -.42em; margin-left: 3px; object-fit: contain; }
  .pod { display: flex; gap: 10px; align-items: stretch; }
  .pv { flex: 0 0 var(--pw, 42%); max-width: 260px; position: relative; aspect-ratio: 16 / 9; border-radius: 9px; overflow: hidden; background: #000; align-self: center; }
  .pv iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .pb { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .pb b { font-size: .8rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .pb small { color: var(--dtf-dim); font-size: .66rem; line-height: 1.25; }
  .pb a { color: var(--dtf-accent); font-size: .68rem; text-decoration: none; }
  .sgh { display: flex; align-items: baseline; gap: 7px; margin-bottom: 3px; }
  .sgh b { font-size: .78rem; } .sgh small { margin-left: auto; color: var(--dtf-dim); font-size: .64rem; white-space: nowrap; }
  .sgrow { display: grid; grid-template-columns: 17px max-content minmax(0, 1fr); gap: 6px; align-items: baseline; padding: 1px 3px; border-radius: 7px; line-height: 1.3; }
  .sgrow .n { font-weight: 800; font-size: .68rem; text-align: center; color: #ff8a8e; font-variant-numeric: tabular-nums; }
  .sgrow.mine { background: color-mix(in srgb, var(--dtf-accent) 12%, transparent); box-shadow: inset 2px 0 0 var(--dtf-accent); }
  .sgrow .who { font-weight: 700; font-size: .68rem; white-space: nowrap; }
  .sgrow .you { margin-left: 4px; padding: 0 4px; font-size: .52rem; background: var(--dtf-accent); }
  .sgp { font-size: .64rem; color: var(--dtf-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sgp i { font-style: normal; font-size: .86em; opacity: .7; margin-left: 2px; }
  .sgp .done { color: var(--good, #3fb97a); }
  .sgclean { margin: 3px 3px 0; font-size: .62rem; color: var(--dtf-dim); }
  /* spare room on a tall screen is used: fitHome() tries the roomiest layout first and steps down to the first one that fits */
  .loose1 .grid { --plate: clamp(32px, calc(var(--avail) * .056), 70px); gap: clamp(6px, calc(var(--avail) * .01), 12px); } .loose1 .tile b { font-size: .7rem; margin-top: 4px; }
  .loose1 .tile { padding-top: clamp(6px, calc(var(--avail) * .009), 14px); padding-bottom: clamp(5px, calc(var(--avail) * .008), 12px); } .loose1 .lower { gap: clamp(6px, calc(var(--avail) * .012), 14px); margin-top: clamp(6px, calc(var(--avail) * .012), 14px); }
  .loose2 .grid { --plate: clamp(36px, calc(var(--avail) * .064), 80px); } .loose2 .tile b { font-size: .76rem; } .loose2 .card { padding: 9px 11px 10px; } .loose2 .sgrow { padding: 2px 3px; }
  /* when the page is still taller than the screen, fitHome() tightens it in steps */
  .tight1 .tile:not(.wide) .t { display: none; }
  .tight1 .panel .cap { display: none; } .tight1 .tabs { margin-bottom: 2px; } .tight1 .tabs button { height: 28px; } .tight1 .row { min-height: 30px; }
  .tight1 .feed { padding: 5px 8px 3px; } .tight1 .top { margin: 0; } .tight1 .next { margin-bottom: 5px; } .tight1 .ir { margin-bottom: 3px; }
  .tight2 .grid { --plate: 26px; } .tight2 .tile { padding-top: 3px; padding-bottom: 3px; } .tight2 .tile b { font-size: .62rem; margin-top: 2px; }
  .tight3 .grid { --plate: 22px; } .tight3 .tile b { font-size: .6rem; margin-top: 1px; } .tight3 .row { min-height: 27px; } .tight3 .panel h2 { font-size: .78rem; } .tight3 .meta { display: none; }
  @media (min-width: 900px) {
    .lower { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
    .pb b { font-size: .92rem; } .pb small { font-size: .74rem; } .sgrow .who, .sgp, .sgrow .n { font-size: .74rem; }
  }
  .skel { height: 96px; border-radius: 20px; background: var(--dtf-panel); border: 1px solid var(--dtf-border); opacity: .6; }
</style>
</head><body class="dtf-page"><div class="dtf-wrap">
<div class="top"><h1 class="home">Rumble Hub</h1><button class="me ask" id="me" type="button" aria-label="Who are you?">Who are you?</button></div>
<div class="next" id="next" hidden></div>
<button class="ir" id="ir" type="button" hidden></button>
<section class="feed" id="feed" aria-label="This season at a glance" hidden>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="panels" id="panels"></div>
  <div class="meta" id="meta"></div>
</section>
<div class="grid" id="grid" aria-live="polite">
  <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
  <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
</div>
<div class="lower" id="lower">
  <section class="card pod" id="pod" hidden aria-label="Latest podcast episode">
    <div class="pv"><iframe id="pod-f" title="Latest podcast episode" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
    <div class="pb"><span class="k">Content Boys <img class="cbc" src="/shell/icons/cbc-coin.webp" alt="Content Boy Coin" width="16" height="16" decoding="async"></span><b id="pod-t"></b><small id="pod-m"></small><a id="pod-a" target="_blank" rel="noopener">Open on YouTube</a></div>
  </section>
  <section class="card sg" id="sg" hidden aria-label="Shotguns this season">
    <div class="sgh"><span class="k">Shotguns</span><b id="sg-t"></b><small id="sg-m"></small></div>
    <div id="sg-l"></div>
  </section>
</div>
<p class="foot" id="foot"><a href="/install/">Add Rumble Hub to your home screen</a></p>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if ((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone) $('foot').hidden = true;   // already installed
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function get(url) { return fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }
  function ago(iso) {
    var m = Math.max(0, (Date.now() - Date.parse(iso)) / 60000);
    return m < 90 ? Math.round(m) + ' min ago' : m < 2880 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago';
  }
  // who you are (set by the picker in the nav shell, shared with every tool): {id, name} under dtf.me
  function meName() { try { var v = JSON.parse(ls('dtf.me') || 'null'); return v && v.name || null; } catch (e) { return ls('dtf.me'); } }

  // ---- tool tiles (from the registry)
  // the order on Home (the registry order drives the nav menus, so this is kept here): four tiles on top, four below, then the wide ones
  var HOME_ORDER = ['rumbles', 'trades', 'fab', 'lifetime', 'h2h', 'auction', 'recordbook', 'rulebook'];
  function homeOrder(list) {
    var rank = function (t) { var i = HOME_ORDER.indexOf(t.id); return i < 0 ? HOME_ORDER.length : i; };
    return list.map(function (t, i) { return [t, i]; }).sort(function (a, b) { return rank(a[0]) - rank(b[0]) || a[1] - b[1]; }).map(function (x) { return x[0]; });
  }
  function tile(t) {
    var st = '--c:' + esc(t.color || '#f0914a') + (t.color2 ? ';--c2:' + esc(t.color2) : '');
    var plate = '<span class="plate">' + (t.logo ? '<img src="' + esc(t.logo) + '" alt="" decoding="async">' : '') + '</span>';
    if (t.wide) return '<a class="tile wide" id="tile-' + esc(t.id) + '" href="' + esc(t.path) + '" style="' + st + '">' + plate + '<span class="wb"><b>' + esc(t.name) + '</b><span class="t">' + esc(t.tagline || '') + '</span></span></a>';
    return '<a class="tile" href="' + esc(t.path) + '" style="' + st + '">' + plate +
      '<b>' + esc(t.name) + '</b><span class="t">' + esc(t.tagline || t.description || '') + '</span></a>';
  }
  get('/tools.json').then(function (j) { $('grid').innerHTML = homeOrder(j.tools || []).concat(j.pages || []).map(tile).join(''); champLine(); }).catch(function () {
    try { var c = sessionStorage.getItem('dtf.registry'); if (c) { $('grid').innerHTML = homeOrder(JSON.parse(c).tools || []).map(tile).join(''); return; } } catch (e) {}
    $('grid').innerHTML = '<p>Couldn’t load the tool list. Check your connection and refresh.</p>';
  });

  // the champions tile shows the reigning champion and sacko
  function champLine() {
    var el = document.querySelector('#tile-champions .t'); if (!el) return;
    get('/champions/data.json').then(function (d) {
      var ss = (d.seasons || []).slice().sort(function (a, b) { return b.season - a.season; }), c = ss.filter(function (x) { return x.champion; })[0], k = ss.filter(function (x) { return x.sacko; })[0];
      if (c) el.innerHTML = '<img class="tr" src="/shell/icons/trophy.png" alt="" decoding="async"> <b>' + esc(c.champion.m) + '</b> ' + c.season + (k ? ' · 💩 <b>' + esc(k.sacko.m) + '</b> ' + k.season : '');
    }).catch(function () {});
  }

  // ---- IR eligibility check (computed from FAB-Management's ir_check.py by the hourly feed job)
  function paintIR(ir) {
    var b = $('ir'); if (!ir || !ir.week) { b.hidden = true; return; }
    var v = ir.violations || [], k = ir.blocked || [], who = function (r) { return esc(r.m) + ' (' + esc(r.player) + ')'; }, html, cls = '';
    if (v.length) { cls = 'bad'; html = '⛔ <b>IR check · Wk ' + ir.week + '</b> · ' + v.length + ' on IR who shouldn’t be: ' + v.map(who).join(', ') + (k.length ? ' · ' + k.length + ' can’t go on IR yet: ' + k.map(who).join(', ') : ''); }
    else if (k.length) { cls = 'warn'; html = '🟡 <b>IR check · Wk ' + ir.week + '</b> · ' + k.length + ' new this week, not IR-eligible until next week: ' + k.map(who).join(', '); }
    else html = '✅ <b>IR check · Wk ' + ir.week + '</b> <span class="dim">· all clear</span>';
    b.className = 'ir ' + cls; b.innerHTML = '<span class="tx">' + html + '</span>'; b.hidden = false;
  }
  $('ir').addEventListener('click', function () { this.classList.toggle('open'); });

  // ---- the line under the title: you, your standing, and the next key date (from the Sleeper league settings)
  var LEAGUE = null, STANDINGS = [];
  function paintNext() {
    var me = meName(), bits = [], today = new Date(); today.setHours(0, 0, 0, 0);
    if (me) {
      var st = STANDINGS.filter(function (r) { return r.m === me; })[0];
      bits.push('<b>' + esc(me) + '</b>' + (st ? ' · #' + st.rank + ' · ' + st.rumbles + ' Rumbles' : ''));
    } else if (LEAGUE && LEAGUE.week && LEAGUE.status === 'in_season') bits.push('Wk ' + LEAGUE.week);
    var next = LEAGUE && (LEAGUE.keyDates || []).map(function (d) { var t = new Date(d.date + 'T12:00:00'); return { d: d, t: t, days: Math.round((t - today) / 864e5) }; })
      .filter(function (x) { return x.days >= 0; }).sort(function (a, b) { return a.days - b.days; })[0];
    if (next) bits.push('<b>' + esc(next.d.label) + '</b> ' + next.t.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' + (next.days === 0 ? 'today' : next.days === 1 ? 'tomorrow' : next.days + ' days'));
    $('next').innerHTML = bits.join(' · '); $('next').hidden = !bits.length;
  }
  function paintMe() {
    var me = meName(), b = $('me');
    b.textContent = me || 'Who are you?'; b.className = 'me ' + (me ? 'set' : 'ask');
    paintNext(); markMine(); if (SG) paintShotguns(SG);
  }
  $('me').addEventListener('click', function () { if (window.DTF && DTF.pickMe) DTF.pickMe(); });
  window.addEventListener('dtf:me', paintMe);
  get('/league.json').then(function (l) { LEAGUE = l; paintNext(); }).catch(function () {});

  // ---- the feed: a labelled top 3 per tab (phone) / five columns (desktop)
  var META = {
    matchups: { tab: 'Matchups', title: function (y) { return 'Best matchups of ' + y; }, cap: 'Ranked by drama: tight finish, lead changes, H2H bonus', ac: '#f0914a' },
    trades: { tab: 'Trades', title: function (y) { return 'Biggest trades of ' + y; }, cap: 'By value moved · ▲ tag = winner on net lineup value', ac: '#22d3ee' },
    waivers: { tab: 'Waivers', title: function (y) { return 'Best waiver claims of ' + y; }, cap: 'Ranked by points above replacement (PAR) · $ = FAB bid', ac: '#a3e635' },
    'free-agents': { tab: 'Free agents', title: function (y) { return 'Best free-agent pickups of ' + y; }, cap: 'Ranked by points above replacement (PAR).', ac: '#a3e635' },
    slack: { tab: 'Slack', title: function () { return 'Hot in Slack this week'; }, cap: 'The busiest conversations of the past 7 days.', ac: '#e8eaf0' }
  };
  function rowHtml(it, id) {
    var ext = /^https?:/.test(it.href), mgrs = (it.managers || []).join('|');
    var open = '<a class="row' + (id === 'trades' ? ' trade' : id === 'slack' ? ' slack' : id === 'matchups' ? ' mu' : '') + '" data-m="' + esc(mgrs) + '" href="' + esc(it.href) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + (id === 'trades' && it.sub ? '<span class="rkc"><span class="rk">' + it.rank + '</span><em class="wkn">' + esc(it.sub) + '</em></span>' : '<span class="rk">' + it.rank + '</span>');
    if (id === 'trades' && it.gets) {
      var win = it.winner ? '<span class="win">▲ ' + esc(it.winner) + ' +' + it.edge.toFixed(1) + '</span>' : '<span class="win even">Even</span>';
      var gets = it.gets.map(function (g) { return '<small class="gets"><i>' + esc(g.m) + '</i> gets ' + esc(g.players.join(', ')) + '</small>'; }).join('');
      return open + '<span><span class="tline"><b>' + esc(it.title) + '<span class="youslot"></span></b>' + win + '</span>' + gets + '</span><span class="go" aria-hidden="true">›</span></a>';
    }
    return open + '<span><b>' + esc(it.title) + '<span class="youslot"></span></b><small>' + esc(it.sub) + '</small></span><span class="go" aria-hidden="true">›</span></a>';
  }
  // rows that involve you get a tint and a tag
  function markMine() {
    var me = meName();
    [].forEach.call(document.querySelectorAll('.row[data-m]'), function (r) {
      var mine = !!me && r.dataset.m.split('|').indexOf(me) >= 0;
      r.classList.toggle('mine', mine);
      var slot = r.querySelector('.youslot'); if (slot) slot.innerHTML = mine ? '<span class="you">YOU</span>' : '';
    });
  }
  // every player stays visible: the "gets" line shrinks (down to 8.5px) and only then wraps
  function fitGets() {
    [].forEach.call(document.querySelectorAll('.gets'), function (el) {
      if (!el.offsetWidth) return;
      el.classList.remove('wrap'); el.style.fontSize = '';
      var size = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > el.clientWidth && size > 8.5) { size -= 0.3; el.style.fontSize = size + 'px'; }
      if (el.scrollWidth > el.clientWidth) el.classList.add('wrap');
    });
    [].forEach.call(document.querySelectorAll('.row.trade'), function (row) {   // a trade's two lines share one size
      var g = [].slice.call(row.querySelectorAll('.gets')); if (g.length < 2 || !g[0].offsetWidth) return;
      var m = Math.min.apply(null, g.map(function (e) { return parseFloat(getComputedStyle(e).fontSize); }));
      g.forEach(function (e) { e.style.fontSize = m + 'px'; });
    });
  }
  // matchup titles and sublines stay on one line and slack summaries inside two, by shrinking the text (never below a readable size)
  function fitText() {
    [].forEach.call(document.querySelectorAll('.row.mu b, .row.mu small, .row.slack b, .sgp'), function (el) {
      if (!el.offsetWidth) return;
      el.style.fontSize = '';
      var two = el.closest('.row.slack'), size = parseFloat(getComputedStyle(el).fontSize), min = el.classList.contains('sgp') ? 8 : el.tagName === 'SMALL' ? 8.5 : two ? 9.5 : 10;
      var over = function () { return two ? el.scrollHeight > el.clientHeight + 1 : el.scrollWidth > el.clientWidth + 1; };
      while (over() && size > min) { size -= 0.25; el.style.fontSize = size + 'px'; }
    });
  }
  // every tile label sits on one line at one shared size (the longest name sets it), so the tiles are identical
  function fitTiles() {
    var bs = [].slice.call(document.querySelectorAll('.grid .tile:not(.wide) b')); if (!bs.length || !bs[0].offsetWidth) return;
    bs.forEach(function (b) { b.style.fontSize = ''; });
    var size = parseFloat(getComputedStyle(bs[0]).fontSize), min = 8, over = function () { return bs.some(function (b) { return b.scrollWidth > b.clientWidth + 0.5 || b.scrollWidth > b.parentNode.clientWidth - 6; }); };
    while (over() && size > min) { size -= 0.25; bs.forEach(function (b) { b.style.fontSize = size + 'px'; }); }
  }
  function fitAll() { fitGets(); fitText(); fitHome(); fitTiles(); }
  // Home is meant to fit one screen: if the content is taller than the space between the bars it is tightened in steps (the lower cards
  // shrink, the feed loses its caption, the tiles get smaller) and stops as soon as it fits; below the last step the page just scrolls
  // [Shotguns zoom, player width %, layout]: negative layouts are roomier (loose1, loose2), positive ones tighter (tight1, tight2). The roomiest that fits wins.
  var HOME_STEPS = [[1.22, 52, -2], [1.14, 48, -2], [1.14, 48, -1], [1.08, 45, -1], [1, 42, 0], [1, 42, 1], [.92, 38, 1], [.84, 34, 1], [.84, 34, 2], [.76, 30, 2], [.76, 30, 3]];
  function fitHome() {
    var lo = $('lower'), sg = $('sg'), root = document.querySelector('.dtf-wrap'); if (!lo || !root) return;
    var over = function () { return document.documentElement.scrollHeight > window.innerHeight; };
    for (var i = 0; i < HOME_STEPS.length; i++) {
      var st = HOME_STEPS[i];
      sg.style.zoom = st[0] === 1 ? '' : st[0]; lo.style.setProperty('--pw', st[1] + '%');
      root.classList.toggle('loose2', st[2] <= -2); root.classList.toggle('loose1', st[2] <= -1);
      root.classList.toggle('tight1', st[2] >= 1); root.classList.toggle('tight2', st[2] >= 2); root.classList.toggle('tight3', st[2] >= 3);
      fitTiles();
      if (!over()) break;
    }
  }
  window.addEventListener('resize', fitAll);
  window.addEventListener('load', function () { setTimeout(fitHome, 150); setTimeout(fitHome, 900); });   // fonts, the player and late data settle after the first fit
  Promise.allSettled([get('/feed.json'), get('/slack.json')]).then(function (res) {
    var sections = [], feed = res[0].status === 'fulfilled' ? res[0].value : null, slack = res[1].status === 'fulfilled' ? res[1].value : null;
    if (feed) { STANDINGS = feed.standings || []; feed.sections.forEach(function (s) { if (META[s.id]) sections.push({ id: s.id, items: s.items }); }); paintNext(); }
    if (slack && slack.topics && slack.topics.length && (Date.now() - Date.parse(slack.generatedAt)) < 10 * 864e5) {
      sections.push({ id: 'slack', items: slack.topics.map(function (t, i) { return { rank: i + 1, title: t.title, sub: '#' + t.channel + ' · ' + t.messages + ' messages', href: t.href }; }) });
    }
    if (feed) paintIR(feed.ir);
    if (!sections.length) return;
    var year = feed ? feed.season : '', want = ls('dtf.homeTab'), on = sections.some(function (s) { return s.id === want; }) ? want : sections[0].id;
    $('tabs').innerHTML = sections.map(function (s) { return '<button role="tab" data-id="' + s.id + '" aria-selected="' + (s.id === on) + '">' + META[s.id].tab + '</button>'; }).join('');
    $('panels').style.setProperty('--n', sections.length);
    $('panels').innerHTML = sections.map(function (s) {
      var m = META[s.id];
      return '<div class="panel' + (s.id === on ? ' on' : '') + '" role="tabpanel" data-id="' + s.id + '" style="--ac:' + m.ac + '"><h2>' + esc(m.title(year)) + '</h2><span class="cap">' + esc(m.cap) + '</span>' +
        (s.items.length ? s.items.map(function (it) { return rowHtml(it, s.id); }).join('') : '<p class="none">Nothing yet this season.</p>') + '</div>';
    }).join('');
    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-id]'); if (!b) return;
      ls('dtf.homeTab', b.dataset.id);
      [].forEach.call($('tabs').children, function (x) { x.setAttribute('aria-selected', x === b); });
      [].forEach.call($('panels').children, function (p) { p.classList.toggle('on', p.dataset.id === b.dataset.id); });
      fitAll();
    });
    var gen = feed && feed.generatedAt, old = gen && (Date.now() - Date.parse(gen)) > 2 * 864e5;
    $('meta').innerHTML = gen ? ('updated ' + ago(gen) + (old ? ' <span class="old">· may be out of date</span>' : '')) : '';
    $('feed').hidden = false;
    markMine(); fitAll();
  });
  // ---- latest podcast episode: the last YouTube link posted in #podcast (podcast.json, built by the Slack job)
  get('/podcast.json').then(function (p) {
    if (!p || !p.videoId) return;
    $('pod-t').textContent = p.title || 'Latest episode';
    $('pod-m').textContent = (p.channel ? p.channel + ' \u00b7 ' : '') + (p.postedAt ? 'posted ' + ago(p.postedAt) : '');
    $('pod-a').href = p.url || ('https://www.youtube.com/watch?v=' + encodeURIComponent(p.videoId));
    $('pod-f').src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(p.videoId) + '?rel=0&playsinline=1';
    $('pod').hidden = false; fitHome();
  }).catch(function () {});
  // ---- this season's Shotguns (shotguns.json, built from the Record Book's weekly cache)
  var SG = null;
  function paintShotguns(d) {
    SG = d;
    var me = meName(), withAny = (d.managers || []).filter(function (m) { return m.count > 0; }), clean = (d.managers || []).filter(function (m) { return !m.count; });
    $('sg-t').textContent = d.season + ' \u00b7 ' + d.total + (d.total === 1 ? ' shotgun' : ' shotguns');
    $('sg-m').textContent = d.throughWeek ? 'through week ' + d.throughWeek : '';
    $('sg-l').innerHTML = (withAny.length ? withAny.map(function (m) {
      return '<div class="sgrow' + (m.name === me ? ' mine' : '') + '"><span class="n">' + m.count + '</span><span class="who">' + esc(m.name) + (m.name === me ? '<span class="you">YOU</span>' : '') + '</span><span class="sgp">' +
        m.shots.map(function (s) { return '<span class="' + (s.done ? 'done' : '') + '" title="' + esc(s.full) + ', week ' + s.week + ': ' + s.pts + ' pts">' + esc(s.player) + '<i>' + s.week + '</i></span>'; }).join(', ') + '</span></div>';
    }).join('') : '<p class="none">No shotguns yet this season.</p>') + (clean.length && withAny.length ? '<p class="sgclean">Clean so far: ' + clean.map(function (m) { return esc(m.name); }).join(', ') + '</p>' : '');
    $('sg').hidden = false; fitHome();
  }
  get('/shotguns.json').then(function (d) { if (d && d.managers) paintShotguns(d); }).catch(function () {});
  paintMe();
})();
</script>
